apiVersion: v1
kind: Service
metadata:
  name: ml-platform-api
  labels:
    app: ml-platform-api
  annotations:
    # Ignore dangling-service check - deployment will be created separately
    ignore-check.kube-linter.io/dangling-service: "Deployment created separately"
spec:
  type: NodePort # Use NodePort for Minikube local access
  selector:
    app: ml-platform-api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
