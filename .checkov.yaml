directory:
  - terraform
framework:
  - terraform
  - dockerfile
  - kubernetes
  - secrets

# Aggressive scanning configuration
quiet: false # Show all output for visibility
download-external-modules: true
external-checks-dir:
  - checkov_policies

# Security level
compact: false # Detailed output
# hard-fail-on configured in CI workflow for SARIF generation compatibility
# Remediation approach: New violations block CI; legacy findings tracked in backlog
# Suppressions require documented justification via skip-check with inline comments

# Latest security checks
enable-secret-scan-all-files: true # Comprehensive CI scanning (detect-secrets handles pre-commit)

# Suppress specific checks only when explicitly documented
# skip-check: []

# Custom checks
check:
  - CKV_CUSTOM_AWS_001
# Paranoid mode: fail on any finding
# soft-fail: false # Uncomment to make all findings fail the build

# Update checks from Bridgecrew platform (requires API key)
# prisma-api-url: https://api.prismacloud.io
# bc-api-key: ${BRIDGECREW_API_KEY}
