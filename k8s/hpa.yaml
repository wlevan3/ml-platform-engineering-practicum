apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-platform-api
  labels:
    app: ml-platform-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-platform-api

  minReplicas: 2   # Minimum for high availability
  maxReplicas: 10  # Maximum to prevent runaway scaling (keep in sync with terraform/environments/dev/quotas.tf)

  # Scaling behavior configuration
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling up (avoid flapping)
      policies:
        - type: Percent
          value: 50          # Scale up by 50% of current replicas
          periodSeconds: 60  # Every 60 seconds
        - type: Pods
          value: 2           # Or add 2 pods at a time (whichever is higher)
          periodSeconds: 60
      selectPolicy: Max      # Use the policy that adds more pods

    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down (avoid flapping)
      policies:
        - type: Percent
          value: 25          # Scale down by 25% of current replicas
          periodSeconds: 60  # Every 60 seconds
        - type: Pods
          value: 1           # Or remove 1 pod at a time (whichever is lower)
          periodSeconds: 60
      selectPolicy: Min      # Use the policy that removes fewer pods

  # Metrics for scaling decisions
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale when average CPU > 70%

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Scale when average memory > 80%

# Metrics Server is required for HPA to work
# Installed automatically in EKS, but adding note here for documentation
#
# If metrics-server is not installed, deploy it with:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Verify metrics-server is running:
#   kubectl get deployment metrics-server -n kube-system
#
# Verify HPA can read metrics:
#   kubectl get hpa ml-platform-api
#   kubectl describe hpa ml-platform-api
