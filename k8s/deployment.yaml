apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-api
  labels:
    app: ml-platform-api
    version: v1
spec:
  replicas: 2  # High availability with 2 replicas
  selector:
    matchLabels:
      app: ml-platform-api
  template:
    metadata:
      labels:
        app: ml-platform-api
        version: v1
    spec:
      # Disable service account automounting for security (SonarCloud kubernetes:S6865)
      automountServiceAccountToken: false
      containers:
        - name: ml-platform-api
          image: ml-platform-api:v1.0.0  # Use versioned tag (SonarCloud kubernetes:S6596)
          imagePullPolicy: Never  # MINIKUBE ONLY - Change to "IfNotPresent" for AWS EKS
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          # Resource limits and requests
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"  # Ephemeral storage request (SonarCloud kubernetes:S6897)
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "2Gi"  # Prevent unlimited ephemeral storage consumption

          # Liveness probe - checks if container is alive
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20  # Allow time for ML model loading at startup
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - checks if container is ready to serve traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Environment variables
          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Some libraries (e.g., model deserialization, Python imports) require write access to /tmp for temporary files
            capabilities:
              drop:
                - ALL
