repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]

  # Python formatting and linting
  # Phase 8 end state:
  # - Ruff is the canonical linter and formatter.
  # - Black is removed from pre-commit to avoid conflicting formatting guidance.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
        name: ruff (lint)
        args:
          - --fix
          - --exit-non-zero-on-fix
      - id: ruff-format
        name: ruff (format)

  # Python type checking
  # Uses mypy with configuration from mypy.ini; aligns with CI usage.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - joblib-stubs==1.5.2.0.20250831

  # Terraform formatting and security
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  # IaC and container security scanning
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.489
    hooks:
      - id: checkov
        args:
          [
            --framework,
            dockerfile,
            kubernetes,
            terraform,
            secrets,
            --config-file,
            .checkov.yaml,
          ]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-ll", "-i"]
        exclude: ^tests/

  # Semgrep SAST (Static Application Security Testing)
  - repo: https://github.com/semgrep/semgrep
    rev: v1.89.0
    hooks:
      - id: semgrep
        name: Semgrep Security Scan
        args:
          - --config=.semgrep.yml
          - --error
          - --timeout=60
          - --verbose
        files: \.py$
        exclude: ^tests/

  # Local hooks
  - repo: local
    hooks:
      - id: ruff-all-with-uv
        name: ruff check . via uv (full repo)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [commit]
