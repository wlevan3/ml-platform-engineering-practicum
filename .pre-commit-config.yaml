repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]

  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Python type checking
  # Note: Using explicit additional_dependencies instead of --install-types for:
  # - Deterministic behavior (no dynamic downloads from PyPI)
  # - Faster execution (no 10-30s download on first run)
  # - Offline compatibility (no network dependency)
  # Type coverage: FastAPI, pydantic, numpy, httpx ship with inline types
  # joblib-stubs provides type stubs for joblib (no native types)
  # sklearn ignored in mypy.ini (sklearn-stubs v0.0.3 has bugs)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic # Required for mypy to understand pydantic models
          - joblib-stubs==1.5.2.0.20250831 # Type stubs for joblib
          # No args needed - mypy reads configuration from mypy.ini

  # Terraform formatting and security
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tfsec
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  # IaC security scanning (Dockerfile, Kubernetes, Terraform, etc.)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.489
    hooks:
      - id: checkov
        args:
          [
            --quiet,
            --framework,
            dockerfile,
            kubernetes,
            terraform,
            --config-file,
            .checkov.yaml,
          ]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-ll", "-i"] # Low severity level, ignore info messages
        exclude: ^tests/

  # Semgrep SAST (Static Application Security Testing)
  - repo: https://github.com/semgrep/semgrep
    rev: v1.89.0
    hooks:
      - id: semgrep
        name: Semgrep Security Scan
        args:
          - --config=.semgrep.yml # Use custom focused ruleset for speed
          - --error # Only fail on ERROR severity findings
          - --timeout=60 # Prevent hanging on complex files
          - --verbose # Show which rules are running
        files: \.py$ # Only scan Python files
        # Exclude tests for pre-commit speed optimization
        # Tests are scanned comprehensively in CI (see .github/workflows/ci.yml)
        # Rationale: Developer feedback speed > comprehensive pre-commit coverage
        exclude: ^tests/

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude: ^infra/aws-core/terraform/environments/.*/README\.md$ # Exclude terraform-docs generated files
