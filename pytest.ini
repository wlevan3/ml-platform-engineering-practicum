[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts =
    --cov=services.api
    --cov-report=xml
    --cov-report=term-missing
    -v

[coverage:run]
# Source code to measure
source = services/api

# Paths to exclude from coverage
omit =
    tests/*
    .venv/*
    services/api/models/*
    **/__pycache__/*
    **/*.pyc
