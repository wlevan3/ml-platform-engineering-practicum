# Mypy configuration for ML Platform Engineering Practicum
# https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
check_untyped_defs = True

# Exclude paths that shouldn't be type-checked
exclude = (?x)(
    ^\.venv/
    | ^\.git/
    | ^\.pytest_cache/
    | ^\.external_modules/
    | ^\.terraform/
    | ^\.claude/
    | ^infra/
    | ^platform/
    | ^tests/
)

# Per-module configuration for libraries lacking type stubs
# Note: We use targeted ignores instead of blanket --ignore-missing-imports
# to maintain type checking for the majority of dependencies that ARE typed

[mypy-sklearn.*]
# scikit-learn has partial native types (added py.typed in v1.3)
# but scikit-learn-stubs (v0.0.3) is experimental with known bugs
# Re-evaluate when sklearn 2.x ships with comprehensive type annotations
ignore_missing_imports = True

[mypy-skops.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
