name: "Auto-Resolve Outdated Comments"

on:
  pull_request:
    types: [synchronize, opened, reopened]
  pull_request_review:
    types: [submitted]

permissions: {} # Restrict default permissions, grant specific permissions per job

jobs:
  resolve-outdated:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Resolve outdated Copilot comments
        uses: Ardiannn08/resolve-outdated-comment@f166e7d2da880b2410df42501a678910f2a1e6ca # v1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filter-user: "Copilot"
          mode: "resolve"
