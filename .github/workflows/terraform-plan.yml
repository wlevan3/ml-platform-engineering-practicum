name: Terraform Plan

# =============================================================================
# TERRAFORM PLAN WORKFLOW (Pull Request Automation)
# =============================================================================
#
# PURPOSE:
#   Automatically runs terraform plan on PRs that modify infrastructure code
#   Provides plan output as PR comment for review
#
# WHEN IT RUNS:
#   - On pull requests to main branch
#   - Only when Terraform files or this workflow changes
#
# WHAT IT DOES:
#   - Validates Terraform configuration
#   - Generates execution plan
#   - Uploads plan as artifact
#   - NO CHANGES ARE APPLIED (read-only)
#
# =============================================================================

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/aws-core/terraform/**"
      - ".github/workflows/terraform-*.yml"

# Prevent concurrent plans for same PR
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write # Required for AWS OIDC
  contents: read # Required to checkout
  pull-requests: write # To comment on PR

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-TF-Plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Refresh
        run: terraform refresh -no-color
        continue-on-error: false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -no-color | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: terraform-plan-pr-${{ github.event.pull_request.number }}
          path: infra/aws-core/terraform/environments/dev/plan.txt
          retention-days: 30

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/aws-core/terraform/environments/dev/plan.txt', 'utf8');
            const output = `## Terraform Plan 📋

            <details>
            <summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            **Event**: \`${{ github.event_name }}\`
            **Run**: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
