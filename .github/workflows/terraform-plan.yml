name: Terraform Plan

# =============================================================================
# TERRAFORM PLAN WORKFLOW (Pull Request Automation)
# =============================================================================
#
# PURPOSE:
#   Automatically runs terraform plan on PRs that modify infrastructure code
#   Provides plan output as PR comment for review
#
# WHEN IT RUNS:
#   - On pull requests to main branch
#   - Only when Terraform files or this workflow changes
#
# WHAT IT DOES:
#   - Validates Terraform configuration
#   - Generates execution plan
#   - Uploads plan as artifact
#   - NO CHANGES ARE APPLIED (read-only)
#
# =============================================================================

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/aws-core/terraform/**"
      - ".github/workflows/terraform-*.yml"

# Prevent concurrent plans for same PR
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write        # Required for AWS OIDC
  contents: read         # Required to checkout
  pull-requests: write   # To comment on PR

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-TF-Plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -no-color -lock=false | tee plan.txt
          terraform show -json tfplan > plan.json

      - name: Analyze Terraform Plan
        id: analyze
        run: |
          "${GITHUB_WORKSPACE}/scripts/analyze-terraform-plan.sh" plan.json
        continue-on-error: false

      - name: Upload plan artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: terraform-plan-pr-${{ github.event.pull_request.number }}
          path: |
            infra/aws-core/terraform/environments/dev/plan.txt
            infra/aws-core/terraform/environments/dev/plan.json
            infra/aws-core/terraform/environments/dev/tfplan
          retention-days: 30

      - name: Comment plan on PR with Analysis
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');

            // Read plan output
            const plan = fs.readFileSync('infra/aws-core/terraform/environments/dev/plan.txt', 'utf8');

            // Read analysis outputs from GitHub Actions
            const analysisComplete = '${{ steps.analyze.outputs.analysis_complete }}' === 'true';
            const totalChanges = '${{ steps.analyze.outputs.total_changes }}' || '0';
            const creates = '${{ steps.analyze.outputs.creates }}' || '0';
            const updates = '${{ steps.analyze.outputs.updates }}' || '0';
            const deletions = '${{ steps.analyze.outputs.deletions }}' || '0';
            const replacements = '${{ steps.analyze.outputs.replacements }}' || '0';
            const hasDeletions = '${{ steps.analyze.outputs.has_deletions }}' === 'true';
            const hasReplacements = '${{ steps.analyze.outputs.has_replacements }}' === 'true';
            const hasCriticalDeletions = '${{ steps.analyze.outputs.has_critical_deletions }}' === 'true';
            const largeChangesWarning = '${{ steps.analyze.outputs.large_changes_warning }}' === 'true';
            const largeChangesCount = '${{ steps.analyze.outputs.large_changes_count }}' || '0';

            // Build analysis summary
            let analysisSection = '';
            if (analysisComplete) {
              analysisSection = `
            ## 📊 Plan Analysis Results
            | Metric | Count |
            |--------|-------|
            | 🏗️ Resources Changed | ${totalChanges} |
            | ➕ Create | ${creates} |
            | 🔄 Update | ${updates} |
            | 🗑️ Delete | ${deletions} |
            | 🔁 Replace | ${replacements} |

            `;

              if (hasCriticalDeletions) {
                analysisSection += `
            ⚠️ **CRITICAL WARNING** ⚠️
            🚨 This plan deletes **CRITICAL** infrastructure resources!
            ❌ Workflow will fail due to critical resource deletions

            `;
              } else if (hasDeletions || hasReplacements) {
                analysisSection += `
            ⚠️ **ATTENTION REQUIRED**
            ${hasDeletions ? `🗑️ This plan includes **${deletions}** deletion(s) - review carefully\n` : ''}
            ${hasReplacements ? `🔁 This plan includes **${replacements}** replacement(s) - review carefully\n` : ''}

            `;
              }

              if (largeChangesWarning) {
                analysisSection += `
            📈 **Large Change Detected**
            This plan modifies **${largeChangesCount}** resources (threshold: 10)

            `;
              }

              if (!hasCriticalDeletions) {
                analysisSection += '✅ **Plan Analysis Passed** - No critical issues detected\n\n';
              }
            }

            const output = `## Terraform Plan 📋
            ${analysisSection}
            <details>
            <summary>Show Full Plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`

            </details>

            **Event**: \`${{ github.event_name }}\`
            **Run**: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Analysis**: \`${analysisComplete ? '✅ Complete' : '❌ Failed'}\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
