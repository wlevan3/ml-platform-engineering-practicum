name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: false # Wait for queued runs to prevent state lock conflicts

permissions: {} # Restrict default permissions, grant specific permissions per job

env:
  DOCKER_IMAGE_ARTIFACT: docker-image-${{ github.sha }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  OPA_VERSION: v0.67.0
  SENTINEL_VERSION: 0.40.0

jobs:
  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          strict: true
          config_file: .yamllint.yaml

  actionlint:
    name: GitHub Actions Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run actionlint
        uses: reviewdog/action-actionlint@4f8f9963ca57a41e5fd5b538dd79dbfbd3e0b38a # v1.54.0

  file-checks:
    name: File Hygiene Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check trailing whitespace
        run: |
          if grep -r -I '[[:space:]]$' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=.claude \
            --exclude-dir=.external_modules \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.terraform \
            --exclude-dir=backlog \
            --exclude='*.pyc' \
            .; then
            echo "❌ Files with trailing whitespace found"
            exit 1
          fi
          echo "✅ No trailing whitespace"

      - name: Check end of file newlines
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if [ -n "$(tail -c 1 "$file")" ]; then
              echo "❌ Missing newline at EOF: $file"
              status=1
            fi
          done < <(find . -type f \( -name "*.py" -o -name "*.md" -o -name "*.yml" -o -name "*.yaml" -o -name "*.tf" \) -not -path "./.git/*" -not -path "./.venv/*" -not -path "./.claude/*" -not -path "./.external_modules/*" -not -path "./.pytest_cache/*" -not -path "*/.terraform/*" -not -path "*/backlog/*" -print0)
          if [ $status -eq 0 ]; then
            echo "✅ All files end with newline"
          fi
          exit $status

      - name: Check for large files
        run: |
          large_files=$(find . -type f -size +1000k -not -path "./.git/*" -not -path "./.venv/*" -not -path "./.claude/*" -not -path "./.pytest_cache/*" -not -path "./.external_modules/*" -not -path "*/.terraform/*" -not -path "*/backlog/*")
          if [ -n "$large_files" ]; then
            echo "❌ Large files (>1MB) detected:"
            echo "$large_files"
            exit 1
          fi
          echo "✅ No large files detected"

      - name: Check for merge conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!.github/workflows/ci.yml'; then
            echo "❌ Merge conflict markers found"
            exit 1
          fi
          echo "✅ No merge conflict markers"

      - name: Check for private keys
        run: |
          if grep -r "BEGIN.*PRIVATE KEY" \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=.claude \
            --exclude-dir=.external_modules \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.terraform \
            --exclude-dir=backlog \
            --exclude=ci.yml \
            .; then
            echo "❌ Private key detected"
            exit 1
          fi
          echo "✅ No private keys detected"

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  python-security-lint:
    name: Python Security Linting (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit==1.8.6

      - name: Run Bandit
        run: bandit -ll -i -r . --exclude ./tests,./venv,./.venv

  terraform-docs-check:
    name: Terraform Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Find Terraform modules with .tf files
        id: find_modules
        run: |
          if [ ! -d "infra/aws-core/terraform" ]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Terraform docs check - infra/aws-core/terraform/ directory does not exist yet"
            exit 0
          fi

          # Find directories with .tf files and README.md (exclude .terraform directories)
          modules=$(find infra/aws-core/terraform/modules -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u | grep -v "^$" || echo "")

          if [ -z "$modules" ]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No Terraform modules with .tf files found"
          else
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
            echo "Found modules:"
            echo "$modules"
          fi

      - name: Install terraform-docs
        if: steps.find_modules.outputs.has_modules == 'true'
        run: |
          curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs --version

      - name: Check Terraform module documentation
        if: steps.find_modules.outputs.has_modules == 'true'
        run: |
          status=0
          # Check each module directory with .tf files
          for module_dir in $(find infra/aws-core/terraform/modules -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u); do
            if [ -f "$module_dir/README.md" ]; then
              echo "Checking $module_dir"
              cd "$module_dir"
              terraform-docs markdown table --output-file README.md --output-mode inject .
              if ! git diff --exit-code README.md; then
                echo "❌ Terraform documentation is out of sync in $module_dir"
                status=1
              fi
              cd - > /dev/null
            fi
          done

          if [ $status -eq 0 ]; then
            echo "✅ All Terraform documentation is up to date"
          else
            echo "❌ Run terraform-docs to update documentation"
            exit 1
          fi

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check if terraform directory exists
        id: check_terraform
        run: |
          if [ -d "infra/aws-core/terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Terraform validation - infra/aws-core/terraform/ directory does not exist yet"
          fi

      - name: Setup Terraform
        if: steps.check_terraform.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Format Check
        if: steps.check_terraform.outputs.exists == 'true'
        run: terraform fmt -check -recursive infra/aws-core/terraform/

      - name: Terraform Init (backend=false)
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd infra/aws-core/terraform
          terraform init -backend=false

      - name: Terraform Validate
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd infra/aws-core/terraform
          terraform validate

      - name: Check if AWS credentials are available
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ] || [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "⚠️ AWS credentials not configured. Skipping Terraform plan."
            exit 0
          fi

  python-ci:
    name: Python CI (uv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py311-

      - name: Sync dependencies with uv
        run: uv sync

      - name: Run Ruff (lint)
        run: uv run ruff check .

      - name: Run Ruff (format check)
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Run pytest
        run: uv run pytest
