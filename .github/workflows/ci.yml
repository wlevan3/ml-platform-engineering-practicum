name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Markdown linting
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8  # v16
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'
        continue-on-error: true

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if terraform directory exists
        id: check_terraform
        run: |
          if [ -d "terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Terraform validation - terraform/ directory does not exist yet"
          fi

      - name: Setup Terraform
        if: steps.check_terraform.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        if: steps.check_terraform.outputs.exists == 'true'
        run: terraform fmt -check -recursive terraform/
        continue-on-error: true

      - name: Terraform Init
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd terraform
          terraform validate

      - name: TFLint
        if: steps.check_terraform.outputs.exists == 'true'
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4  # v4.0.0
        with:
          tflint_version: latest

      - name: Run TFLint
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd terraform
          tflint --init
          tflint --recursive
        continue-on-error: true

  kubernetes-validate:
    name: Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if k8s directory exists
        id: check_k8s
        run: |
          if [ -d "k8s" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Kubernetes validation - k8s/ directory does not exist yet"
          fi

      - name: Setup kubeval
        if: steps.check_k8s.outputs.exists == 'true'
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate Kubernetes manifests
        if: steps.check_k8s.outputs.exists == 'true'
        run: |
          find k8s \( -name '*.yaml' -o -name '*.yml' \) -print0 | xargs -0 kubeval --strict
        continue-on-error: true

      - name: Lint Kubernetes manifests
        if: steps.check_k8s.outputs.exists == 'true'
        uses: stackrox/kube-linter-action@4586e0224d31e1aa7798b8cb2e3817c6a93ff2ec  # v1.0.7
        with:
          directory: k8s/
          config: .kube-linter.yaml
        continue-on-error: true

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pytest

      - name: Run Black (formatting check)
        run: black --check .
        continue-on-error: true

      - name: Run Ruff (linting)
        run: ruff check .
        continue-on-error: true

  python-test:
    name: Python Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model for tests
        run: python train_model.py

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8  # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  gitleaks-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-scan:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/security-audit
            p/python
            p/owasp-top-ten
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  pre-commit-checks:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
        continue-on-error: true

  docker-build-scan:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [python-test]  # Only containerize tested code
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and train model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python train_model.py

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Build Docker image (multi-stage complete)
        run: docker build -t ml-platform-api:${{ github.sha }} .

      - name: Build Docker image (builder stage only)
        run: docker build --target builder -t ml-platform-api:builder-${{ github.sha }} .

      - name: Build Docker image (runtime stage only)
        run: docker build --target runtime -t ml-platform-api:runtime-${{ github.sha }} .

      - name: Scan complete image with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0 (Trivy v0.67.2)
        with:
          scan-type: 'image'
          image-ref: 'ml-platform-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail build on HIGH/CRITICAL findings
          version: 'v0.67.2'  # Explicitly pin Trivy version

      - name: Upload Trivy image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image-scan'

      - name: Scan builder stage with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0 (Trivy v0.67.2)
        with:
          scan-type: 'image'
          image-ref: 'ml-platform-api:builder-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-builder-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          version: 'v0.67.2'

      - name: Upload Trivy builder results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-builder-results.sarif'
          category: 'trivy-builder-scan'

      - name: Scan runtime stage with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0 (Trivy v0.67.2)
        with:
          scan-type: 'image'
          image-ref: 'ml-platform-api:runtime-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-runtime-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          version: 'v0.67.2'

      - name: Upload Trivy runtime results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-runtime-results.sarif'
          category: 'trivy-runtime-scan'

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    # Note: Some jobs (python-*, semgrep) have conditionals and may be skipped.
    # The 'if: always()' ensures this summary runs regardless, showing 'skipped' for those jobs.
    # Note: SonarCloud analysis runs via Automatic Analysis (GitHub App integration), not as a CI job.
    needs: [lint-and-validate, terraform-validate, kubernetes-validate, python-lint, python-test, security-scan, gitleaks-scan, semgrep-scan, pre-commit-checks, docker-build-scan]
    if: always()

    steps:
      - name: Check job results
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Lint and Validate | ${{ needs.lint-and-validate.result }} |"
            echo "| Terraform Validation | ${{ needs.terraform-validate.result }} |"
            echo "| Kubernetes Validation | ${{ needs.kubernetes-validate.result }} |"
            echo "| Python Linting | ${{ needs.python-lint.result }} |"
            echo "| Python Tests | ${{ needs.python-test.result }} |"
            echo "| Security Scanning (Trivy FS) | ${{ needs.security-scan.result }} |"
            echo "| Docker Build & Image Scan | ${{ needs.docker-build-scan.result }} |"
            echo "| Secret Scanning (Gitleaks) | ${{ needs.gitleaks-scan.result }} |"
            echo "| Semgrep SAST | ${{ needs.semgrep-scan.result }} |"
            echo "| Pre-commit Checks | ${{ needs.pre-commit-checks.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
