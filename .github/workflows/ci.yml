            echo "| SonarCloud Analysis | ${{ needs.sonarcloud.result }} |"
            echo "| Security Scanning (Trivy FS) | ${{ needs.security-scan.result }} |"
            echo "| Docker Build & Image Scan | ${{ needs.docker-build-scan.result }} |"
