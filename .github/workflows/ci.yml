name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: false # Wait for queued runs to prevent state lock conflicts

permissions: {} # Restrict default permissions, grant specific permissions per job

env:
  DOCKER_IMAGE_ARTIFACT: docker-image-${{ github.sha }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  OPA_VERSION: v0.67.0
  SENTINEL_VERSION: 0.40.0

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Markdown linting
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: |
            **/*.md
            !infra/aws-core/terraform/**/*.md
            !README.md
            !.github/PULL_REQUEST_TEMPLATE.md
            !docs/LOCAL_VS_CLOUD.md

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          strict: true
          config_file: .yamllint.yaml

  actionlint:
    name: GitHub Actions Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run actionlint
        uses: reviewdog/action-actionlint@4f8f9963ca57a41e5fd5b538dd79dbfbd3e0b38a # v1.54.0

  file-checks:
    name: File Hygiene Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check trailing whitespace
        run: |
          if grep -r -I '[[:space:]]$' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=.claude \
            --exclude-dir=__pycache__ \
            --exclude-dir=.external_modules \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.terraform \
            --exclude-dir=backlog \
            --exclude='*.pyc' \
            .; then
            echo "❌ Files with trailing whitespace found"
            exit 1
          fi
          echo "✅ No trailing whitespace"

      - name: Check end of file newlines
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if [ -n "$(tail -c 1 "$file")" ]; then
              echo "❌ Missing newline at EOF: $file"
              status=1
            fi
          done < <(find . -type f \( -name "*.py" -o -name "*.md" -o -name "*.yml" -o -name "*.yaml" -o -name "*.tf" \) -not -path "./.git/*" -not -path "./.venv/*" -not -path "./.claude/*" -not -path "./.external_modules/*" -not -path "./.pytest_cache/*" -not -path "*/.terraform/*" -not -path "*/backlog/*" -print0)
          if [ $status -eq 0 ]; then
            echo "✅ All files end with newline"
          fi
          exit $status

      - name: Check for large files
        run: |
          large_files=$(find . -type f -size +1000k -not -path "./.git/*" -not -path "./.venv/*" -not -path "./.claude/*" -not -path "./.pytest_cache/*" -not -path "./.external_modules/*" -not -path "*/.terraform/*" -not -path "*/backlog/*")
          if [ -n "$large_files" ]; then
            echo "❌ Large files (>1MB) detected:"
            echo "$large_files"
            exit 1
          fi
          echo "✅ No large files detected"

      - name: Check for merge conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!.github/workflows/ci.yml'; then
            echo "❌ Merge conflict markers found"
            exit 1
          fi
          echo "✅ No merge conflict markers"

      - name: Check for private keys
        run: |
          if grep -r "BEGIN.*PRIVATE KEY" \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=.claude \
            --exclude-dir=.external_modules \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.terraform \
            --exclude-dir=backlog \
            --exclude=ci.yml \
            .; then
            echo "❌ Private key detected"
            exit 1
          fi
          echo "✅ No private keys detected"

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

  python-security-lint:
    name: Python Security Linting (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit==1.8.6

      - name: Run Bandit
        run: bandit -ll -i -r . --exclude ./tests,./venv,./.venv

  terraform-docs-check:
    name: Terraform Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Find Terraform modules with .tf files
        id: find_modules
        run: |
          if [ ! -d "infra/aws-core/terraform" ]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Terraform docs check - infra/aws-core/terraform/ directory does not exist yet"
            exit 0
          fi

          # Find directories with .tf files and README.md (exclude .terraform directories)
          modules=$(find infra/aws-core/terraform/modules -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u | grep -v "^$" || echo "")

          if [ -z "$modules" ]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No Terraform modules with .tf files found"
          else
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
            echo "Found modules:"
            echo "$modules"
          fi

      - name: Install terraform-docs
        if: steps.find_modules.outputs.has_modules == 'true'
        run: |
          curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs --version

      - name: Check Terraform module documentation
        if: steps.find_modules.outputs.has_modules == 'true'
        run: |
          status=0
          # Check each module directory with .tf files
          for module_dir in $(find infra/aws-core/terraform/modules -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u); do
            if [ -f "$module_dir/README.md" ]; then
              echo "Checking $module_dir"
              cd "$module_dir"
              terraform-docs markdown table --output-file README.md --output-mode inject .
              if ! git diff --exit-code README.md; then
                echo "❌ Terraform documentation is out of sync in $module_dir"
                status=1
              fi
              cd - > /dev/null
            fi
          done

          if [ $status -eq 0 ]; then
            echo "✅ All Terraform documentation is up to date"
          else
            echo "❌ Run terraform-docs to update documentation"
            exit 1
          fi

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check if terraform directory exists
        id: check_terraform
        run: |
          if [ -d "infra/aws-core/terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Terraform validation - infra/aws-core/terraform/ directory does not exist yet"
          fi

      - name: Setup Terraform
        if: steps.check_terraform.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Format Check
        if: steps.check_terraform.outputs.exists == 'true'
        run: terraform fmt -check -recursive infra/aws-core/terraform/

      - name: Terraform Init (backend=false)
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd infra/aws-core/terraform
          terraform init -backend=false

      - name: Terraform Validate
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd infra/aws-core/terraform
          terraform validate

      - name: Check if AWS credentials are available
        if: steps.check_terraform.outputs.exists == 'true'
        id: check_aws
        run: |
          if [ -z "${AWS_ACCOUNT_ID:-}" ]; then
            echo "⚠️ AWS_ACCOUNT_ID not configured - skipping Terraform plan and policy validation"
            echo "aws_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ AWS_ACCOUNT_ID configured"
            echo "aws_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials for plan
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-TerraformPlan-${{ github.run_id }}

      - name: Terraform Init (with backend)
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        working-directory: infra/aws-core/terraform/environments/dev
        run: terraform init

      - name: Install OPA CLI
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Install Sentinel CLI
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        run: |
          curl -L -o sentinel.zip "https://releases.hashicorp.com/sentinel/${SENTINEL_VERSION}/sentinel_${SENTINEL_VERSION}_linux_amd64.zip"
          unzip -o sentinel.zip sentinel
          sudo mv sentinel /usr/local/bin/sentinel
          rm -f sentinel.zip

      - name: Terraform Plan (binary)
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        working-directory: infra/aws-core/terraform/environments/dev
        run: |
          echo "📋 Running Terraform plan..."
          terraform plan -out plan.tfplan -no-color

      - name: Terraform Show (text)
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        working-directory: infra/aws-core/terraform/environments/dev
        run: |
          terraform show -no-color plan.tfplan | tee plan.txt

      - name: Evaluate Terraform plan with OPA
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        working-directory: infra/aws-core/terraform/environments/dev
        run: |
          set -euo pipefail

          # Generate JSON plan for OPA
          terraform show -json plan.tfplan > plan.json

          # Run OPA evaluation with error handling
          if ! opa eval \
            --format json \
            --data "$GITHUB_WORKSPACE/infra/policies/opa" \
            --input plan.json \
            "data.terraform.kms.deny" > opa_result.json; then
            echo "❌ OPA evaluation failed"
            exit 1
          fi

          # Validate OPA result file exists and is valid JSON
          if [ ! -f opa_result.json ]; then
            echo "❌ OPA result file not found"
            exit 1
          fi

          # Extract deny count with robust null handling and default value
          # Handle both empty arrays and missing fields gracefully
          DENY_COUNT=$(jq -r '
            if .result and (.result | length > 0) then
              [.result[]?.expressions[]?.value[]? | select(. != null and . != "")] | length
            else
              0
            end
          ' opa_result.json)

          # Validate DENY_COUNT is a valid number
          if ! [[ "$DENY_COUNT" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid OPA result format. DENY_COUNT='$DENY_COUNT'"
            echo "OPA result content:"
            cat opa_result.json
            exit 1
          fi

          echo "📊 OPA evaluation complete: $DENY_COUNT policy violation(s)"

          if [ "$DENY_COUNT" -gt 0 ]; then
            {
              echo "## ❌ OPA Policy Violations"
              echo ""
              echo '```'
              jq -r '.result[]?.expressions[]?.value[]? | select(. != null and . != "")' opa_result.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ OPA policy violations detected:"
            jq -r '.result[]?.expressions[]?.value[]? | select(. != null and . != "")' opa_result.json
            exit 1
          fi

          echo "✅ No OPA policy violations detected"

      - name: Generate Sentinel tfplan mock
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        run: |
          set -euo pipefail
          python3 platform/scripts/generate_sentinel_tfplan_mock.py --plan infra/aws-core/terraform/environments/dev/plan.json --output infra/policies/sentinel/mocks/dev-plan.sentinel
          if [ ! -f infra/policies/sentinel/mocks/dev-plan.sentinel ]; then
            echo "Error: Failed to generate Sentinel mock" >&2
            exit 1
          fi

      - name: Evaluate Terraform plan with Sentinel
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true'
        run: |
          sentinel apply \
            -config infra/policies/sentinel/dev.hcl \
            infra/policies/sentinel/kms.sentinel

      - name: Post plan summary
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true' && always()
        working-directory: infra/aws-core/terraform/environments/dev
        run: |
          {
            echo "## Terraform Plan Summary"
            echo ""
            echo '```'
            grep -A 10 "Plan:" plan.txt || echo "No changes detected"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plan artifacts
        if: steps.check_terraform.outputs.exists == 'true' && steps.check_aws.outputs.aws_available == 'true' && always()
        run: |
          rm -f infra/aws-core/terraform/environments/dev/plan.json infra/policies/sentinel/mocks/dev-plan.sentinel

      - name: TFLint
        if: steps.check_terraform.outputs.exists == 'true'
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4.0.0
        with:
          tflint_version: latest

      - name: Run TFLint
        if: steps.check_terraform.outputs.exists == 'true'
        run: |
          cd infra/aws-core/terraform
          tflint --init
          tflint --recursive

  terraform-security-scan:
    name: Terraform Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check if terraform directory exists
        id: check_terraform
        run: |
          if [ -d "infra/aws-core/terraform" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Terraform security scanning - infra/aws-core/terraform/ directory does not exist yet"
          fi

      - name: Run tfsec
        if: steps.check_terraform.outputs.exists == 'true'
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608 # v0.1.4
        with:
          working_directory: infra/aws-core/terraform
          soft_fail: false
          tfsec_args: --minimum-severity HIGH

      - name: Upload tfsec SARIF to GitHub Security
        if: always() && steps.check_terraform.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
        with:
          sarif_file: tfsec.sarif
          category: tfsec-scan

      - name: Run Checkov
        if: always() && steps.check_terraform.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@d146511ffb733a9a456c9ffc05cd462122037354 # v12.3069.0
        with:
          directory: infra/aws-core/terraform/
          framework: terraform
          soft_fail: true # Allow SARIF generation even with findings
          output_format: sarif
          output_file_path: ./checkov-results.sarif
        continue-on-error: true # Generate SARIF before failing

      - name: Fail on Checkov HIGH/CRITICAL findings
        if: always() && steps.check_terraform.outputs.exists == 'true'
        run: |
          if [ -f ./checkov-results.sarif ]; then
            # Extract HIGH/CRITICAL findings count from SARIF
            # SARIF levels: error=HIGH/CRITICAL, warning=MEDIUM, note=LOW
            HIGH_CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' ./checkov-results.sarif)
            if [ "$HIGH_CRITICAL" -gt 0 ]; then
              echo "❌ Found $HIGH_CRITICAL HIGH/CRITICAL findings"
              exit 1
            fi
          fi

      - name: Upload Checkov SARIF to GitHub Security
        if: always() && steps.check_terraform.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
        with:
          sarif_file: ./checkov-results.sarif
          category: checkov-scan

  kubernetes-validate:
    name: Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check if k8s directory exists
        id: check_k8s
        run: |
          if [ -d "clusters/dev/bootstrap/k8s-manifests" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Kubernetes validation - clusters/dev/bootstrap/k8s-manifests/ directory does not exist yet"
          fi

      - name: Lint Kubernetes manifests
        if: steps.check_k8s.outputs.exists == 'true'
        uses: stackrox/kube-linter-action@4586e0224d31e1aa7798b8cb2e3817c6a93ff2ec # v1.0.7
        with:
          directory: clusters/dev/bootstrap/k8s-manifests/
          config: .kube-linter.yaml

  kubernetes-security-scan:
    name: Kubernetes Security Scanning (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Check if k8s directory exists
        id: check_k8s
        run: |
          if [ -d "clusters/dev/bootstrap/k8s-manifests" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping Kubernetes manifest scanning - clusters/dev/bootstrap/k8s-manifests/ directory does not exist yet"
          fi

      - name: Cache Trivy vulnerability database
        if: steps.check_k8s.outputs.exists == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-v1
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy security scanner on Kubernetes manifests
        if: steps.check_k8s.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1 (Trivy v0.65.0)
        with:
          scan-type: "config"
          scan-ref: "clusters/dev/bootstrap/k8s-manifests/"
          format: "sarif"
          output: "trivy-k8s-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy results to GitHub Security
        if: steps.check_k8s.outputs.exists == 'true' && always()
        uses: github/codeql-action/upload-sarif@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
        with:
          sarif_file: trivy-k8s-results.sarif
          category: trivy-k8s-scan

  train-model:
    name: Train ML Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Upload trained model
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trained-model-${{ github.sha }}
          path: services/api/models/
          retention-days: 1

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install black==25.9.0 ruff==0.14.3 pytest==8.3.4 mypy==1.18.2 pydantic==2.10.5 joblib-stubs==1.5.2.0.20250831 fastapi==0.120.4 scikit-learn==1.6.1 numpy==2.2.2 skops>=0.13.0 httpx==0.28.1

      - name: Run Black (formatting check)
        run: black --check .

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Mypy (type checking)
        run: mypy --no-incremental --follow-imports=silent services/api/

  python-test:
    name: Python Tests with Coverage
    runs-on: ubuntu-latest
    needs: [train-model]

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -r requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trained-model-${{ github.sha }}
          path: services/api/models/

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [python-test, security-scan, semgrep-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis relevancy

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report

      - name: Download Trivy filesystem SARIF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trivy-fs-sarif
          path: sarif-reports/trivy-fs/

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semgrep-sarif
          path: sarif-reports/semgrep/

      - name: List SARIF files
        run: |
          echo "SARIF files available for import:"
          find sarif-reports/ -name "*.sarif" -type f 2>/dev/null | while read -r file; do
            echo "  - $file"
          done || echo "No SARIF files found"

      - name: Fix coverage.xml paths for SonarCloud
        run: |
          # Convert absolute paths to relative paths in coverage.xml
          # SonarCloud runs in Docker and expects relative paths
          sed -i 's|<source>/home/runner/work/ml-platform-engineering-practicum/ml-platform-engineering-practicum</source>|<source>.</source>|g' coverage.xml
          sed -i 's|filename="/home/runner/work/ml-platform-engineering-practicum/ml-platform-engineering-practicum/|filename="|g' coverage.xml
          echo "Fixed coverage.xml paths:"
          head -20 coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Cache Trivy vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-v1
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
        with:
          sarif_file: "trivy-results.sarif"

      - name: Upload Trivy SARIF as artifact for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-results.sarif
          retention-days: 5

  gitleaks-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-scan:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/python
            p/owasp-top-ten
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep SARIF as artifact for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 5

  check-docker-changes:
    name: Check Docker Build Required
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            docker:
              - 'services/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'Dockerfile'
              - 'train_model.py'
              - '.dockerignore'

  docker-build-scan:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [train-model, python-test, check-docker-changes]
    if: needs.check-docker-changes.outputs.needs_build == 'true'
    permissions:
      security-events: write
      contents: read
      id-token: write # Required for keyless signing with OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -r requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trained-model-${{ github.sha }}
          path: services/api/models/

      - name: Cache Trivy vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-v1
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Build Docker image
        run: docker build -t ml-platform-api:${{ github.sha }} .

      # ============================================================================
      # Local Registry Setup for Image Signing
      # ============================================================================
      # Cosign requires OCI registry access to read image manifests, even with
      # --upload=false. We run an ephemeral local registry to satisfy this
      # requirement while keeping signatures as local files (Phase 1 goal).
      # ============================================================================

      - name: Start local OCI registry
        run: |
          echo "Starting local registry on localhost:5000"
          docker run -d -p 5000:5000 --name registry registry:2
          echo "✅ Local registry started"

      - name: Tag and push image to local registry
        run: |
          echo "Tagging image for local registry: localhost:5000/ml-platform-api:${{ github.sha }}"
          docker tag ml-platform-api:${{ github.sha }} localhost:5000/ml-platform-api:${{ github.sha }}

          echo "Pushing image to local registry..."
          docker push localhost:5000/ml-platform-api:${{ github.sha }}

          echo "✅ Image pushed to local registry"
          echo "Image reference: localhost:5000/ml-platform-api:${{ github.sha }}"

      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1 (Trivy v0.65.0)
        with:
          scan-type: "image"
          image-ref: "ml-platform-api:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      # Note: Trivy SARIF upload to GitHub Security removed to prevent blocking merges when Docker build is skipped
      # Trivy still fails CI on HIGH/CRITICAL findings via validation step below

      - name: Fail on Trivy HIGH/CRITICAL findings
        run: |
          if [ -f ./trivy-results.sarif ]; then
            # SARIF levels: error=HIGH/CRITICAL, warning=MEDIUM, note=LOW/INFO
            HIGH_CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' ./trivy-results.sarif)
            if [ "$HIGH_CRITICAL" -gt 0 ]; then
              echo "❌ Found $HIGH_CRITICAL HIGH/CRITICAL vulnerability findings"
              jq -r '.runs[].results[] | select(.level == "error") | "  - \(.ruleId): \(.message.text)"' ./trivy-results.sarif
              exit 1
            else
              echo "✅ No HIGH/CRITICAL vulnerabilities found"
            fi
          else
            echo "⚠️ Trivy SARIF file not found"
            exit 1
          fi

      - name: Upload Trivy Docker SARIF as artifact for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-docker-sarif
          path: trivy-results.sarif
          retention-days: 5

      # ============================================================================
      # Container Image Signing (Phase 1: Offline/Local Signing)
      # ============================================================================
      # Phase 1 Implementation:
      #   - Signs images locally using --upload=false flag
      #   - Stores signature and certificate as files (not in OCI registry)
      #   - Demonstrates signing workflow and validates signatures work
      #   - Signatures are ephemeral (discarded after CI run)
      #
      # Phase 2 Plan (requires ECR setup - see Issue #94):
      #   - Push images to AWS ECR registry
      #   - Sign with fully-qualified ECR image reference
      #   - Signatures stored in OCI registry alongside images
      #   - Persistent signatures for production deployments
      # ============================================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: "v2.4.1"

      - name: Sign container image (keyless - local registry mode)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Phase 1: Signing image from local registry (offline mode)"
          echo "Signing image localhost:5000/ml-platform-api:${{ github.sha }} with keyless signing (OIDC)"
          echo "Note: Using local registry to satisfy Cosign's OCI manifest requirement"
          echo "Note: Using --upload=false - signature stored as local file, not in registry"

          cosign sign --yes \
            --upload=false \
            --output-signature=ml-platform-api.sig \
            --output-certificate=ml-platform-api.crt \
            localhost:5000/ml-platform-api:${{ github.sha }}

          echo "✅ Image signed successfully"
          echo "Signature file: ml-platform-api.sig"
          echo "Certificate file: ml-platform-api.crt"

      - name: Verify container image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Verifying offline signature for localhost:5000/ml-platform-api:${{ github.sha }}"
          echo "Using signature file: ml-platform-api.sig"
          echo "Using certificate file: ml-platform-api.crt"
          echo "Note: Using --insecure-ignore-tlog for Phase 1 offline/local signing mode"

          cosign verify \
            --insecure-ignore-tlog=true \
            --signature=ml-platform-api.sig \
            --certificate=ml-platform-api.crt \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            localhost:5000/ml-platform-api:${{ github.sha }}

          echo "✅ Signature verified successfully"

      - name: Cleanup local registry
        if: always()
        run: |
          echo "Stopping and removing local registry container..."
          docker stop registry || true
          docker rm registry || true
          echo "✅ Local registry cleaned up"

      - name: Save Docker image for SBOM generation
        run: docker save ml-platform-api:${{ github.sha }} -o /tmp/ml-platform-api.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DOCKER_IMAGE_ARTIFACT }}
          path: /tmp/ml-platform-api.tar
          retention-days: 1 # Short-lived, just for CI pipeline

  sbom-generation:
    name: SBOM Generation (Syft)
    runs-on: ubuntu-latest
    needs: [docker-build-scan, check-docker-changes]
    if: needs.check-docker-changes.outputs.needs_build == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -r requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trained-model-${{ github.sha }}
          path: services/api/models/

      # Note: Docker image is reused from docker-build-scan job via artifact sharing
      # This avoids rebuilding the image (saves 2-5 minutes per CI run)
      # Artifact name defined in workflow-level env for consistency
      - name: Download Docker image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.DOCKER_IMAGE_ARTIFACT }}
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/ml-platform-api.tar

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          syft-version: v1.37.0

      - name: Generate SBOM for Docker image (SPDX JSON)
        run: |
          syft ml-platform-api:${{ github.sha }} \
            -o spdx-json \
            --file sbom-docker-spdx.json

      - name: Generate SBOM for Docker image (CycloneDX JSON)
        run: |
          syft ml-platform-api:${{ github.sha }} \
            -o cyclonedx-json \
            --file sbom-docker-cyclonedx.json

      - name: Generate SBOM for Python application (SPDX JSON)
        run: |
          syft dir:. \
            -o spdx-json \
            --file sbom-python-spdx.json

      - name: Generate SBOM for Python application (CycloneDX JSON)
        run: |
          syft dir:. \
            -o cyclonedx-json \
            --file sbom-python-cyclonedx.json

      - name: Display SBOM summary
        run: |
          {
            echo "## SBOM Generation Summary"
            echo ""
            echo "Generated SBOMs for commit: \`${{ github.sha }}\`"
            echo ""
            echo "### Docker Image SBOMs"
            echo "- **SPDX Format**: \`sbom-docker-spdx.json\`"
            echo "- **CycloneDX Format**: \`sbom-docker-cyclonedx.json\`"
            echo ""
            echo "### Python Application SBOMs"
            echo "- **SPDX Format**: \`sbom-python-spdx.json\`"
            echo "- **CycloneDX Format**: \`sbom-python-cyclonedx.json\`"
            echo ""
            echo "### Package Counts"
            echo "\`\`\`"
            echo "Docker Image Packages:"
            jq '.packages | length' sbom-docker-spdx.json
            echo ""
            echo "Python Application Packages:"
            jq '.packages | length' sbom-python-spdx.json
            echo "\`\`\`"
            echo ""
            echo "All SBOMs are available as artifacts for this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-docker
          path: |
            sbom-docker-spdx.json
            sbom-docker-cyclonedx.json
          retention-days: 90 # Keep SBOMs for 90 days (compliance)

      - name: Upload Python SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-python
          path: |
            sbom-python-spdx.json
            sbom-python-cyclonedx.json
          retention-days: 90 # Keep SBOMs for 90 days (compliance)

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    # Note: Some jobs (python-*, semgrep) have conditionals and may be skipped.
    # The 'if: always()' ensures this summary runs regardless, showing 'skipped' for those jobs.
    needs:
      [
        lint-and-validate,
        yaml-lint,
        actionlint,
        file-checks,
        dockerfile-lint,
        python-security-lint,
        terraform-docs-check,
        terraform-validate,
        terraform-security-scan,
        kubernetes-validate,
        kubernetes-security-scan,
        python-lint,
        python-test,
        sonarcloud,
        security-scan,
        gitleaks-scan,
        semgrep-scan,
        docker-build-scan,
        sbom-generation,
      ]
    if: always()

    steps:
      - name: Check job results
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Markdown Linting | ${{ needs.lint-and-validate.result }} |"
            echo "| YAML Linting | ${{ needs.yaml-lint.result }} |"
            echo "| GitHub Actions Linting | ${{ needs.actionlint.result }} |"
            echo "| File Hygiene Checks | ${{ needs.file-checks.result }} |"
            echo "| Dockerfile Linting | ${{ needs.dockerfile-lint.result }} |"
            echo "| Python Security Linting (Bandit) | ${{ needs.python-security-lint.result }} |"
            echo "| Terraform Documentation Check | ${{ needs.terraform-docs-check.result }} |"
            echo "| Terraform Validation | ${{ needs.terraform-validate.result }} |"
            echo "| Terraform Security Scanning (tfsec + Checkov) | ${{ needs.terraform-security-scan.result }} |"
            echo "| Kubernetes Validation | ${{ needs.kubernetes-validate.result }} |"
            echo "| Kubernetes Security Scanning (Trivy) | ${{ needs.kubernetes-security-scan.result }} |"
            echo "| Python Linting | ${{ needs.python-lint.result }} |"
            echo "| Python Tests | ${{ needs.python-test.result }} |"
            echo "| SonarCloud Analysis | ${{ needs.sonarcloud.result }} |"
            echo "| Security Scanning (Trivy FS) | ${{ needs.security-scan.result }} |"
            echo "| Docker Build & Image Scan | ${{ needs.docker-build-scan.result }} |"
            echo "| SBOM Generation (Syft) | ${{ needs.sbom-generation.result }} |"
            echo "| Secret Scanning (Gitleaks) | ${{ needs.gitleaks-scan.result }} |"
            echo "| Semgrep SAST | ${{ needs.semgrep-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
