name: Terraform Manual Operations

# =============================================================================
# TERRAFORM MANUAL OPERATIONS (On-Demand / Emergency)
# =============================================================================
#
# PURPOSE:
#   Manual infrastructure operations for special scenarios
#   Bootstrap, destroy, testing, emergency fixes
#
# WHEN TO USE:
#   - First-time setup (bootstrap)
#   - Destroy infrastructure (cost saving)
#   - Testing changes before PR
#   - Emergency operations
#
# NORMAL WORKFLOW:
#   - PRs → terraform-plan.yml (automatic)
#   - Merge → terraform-apply.yml (automatic)
#   - Use this only when you need manual control
#
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - bootstrap
          - plan-only
          - deploy
          - destroy
          - destroy-eks-only
        default: "plan-only"

      environment:
        description: "Environment to target"
        required: true
        type: choice
        options:
          - dev
        default: "dev"

      image_tag:
        description: "Docker image tag (deploy only)"
        required: false
        default: "manual-deploy"

      deploy_to_k8s:
        description: "Deploy to Kubernetes (deploy only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: terraform-manual-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  # ===========================================================================
  # Bootstrap: Create Terraform backend (S3 + DynamoDB)
  # ===========================================================================
  bootstrap:
    name: Bootstrap Backend
    runs-on: ubuntu-latest
    if: inputs.action == 'bootstrap'

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GHA-Bootstrap-${{ github.run_id }}

      - name: Create S3 bucket
        run: |
          BUCKET="ml-platform-terraform-state-${{ env.AWS_ACCOUNT_ID }}"
          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "✅ S3 bucket already exists"
          else
            aws s3api create-bucket \
              --bucket "${BUCKET}" \
              --region us-west-2 \
              --create-bucket-configuration LocationConstraint=us-west-2
            aws s3api put-bucket-versioning --bucket "${BUCKET}" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${BUCKET}" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            echo "✅ S3 bucket created"
          fi

      - name: Create DynamoDB table
        run: |
          TABLE="ml-platform-terraform-locks"
          if aws dynamodb describe-table --table-name "${TABLE}" --region us-west-2 >/dev/null 2>&1; then
            echo "✅ DynamoDB table already exists"
          else
            aws dynamodb create-table \
              --table-name "${TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-west-2
            echo "✅ DynamoDB table created"
          fi

  # ===========================================================================
  # Deploy or Plan: Terraform operations
  # ===========================================================================
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    if: inputs.action == 'deploy' || inputs.action == 'plan-only'

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/${{ inputs.environment }}

    outputs:
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      ecr_repository_url: ${{ steps.outputs.outputs.ecr_repository_url }}

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GHA-Terraform-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'deploy'
        run: terraform apply -auto-approve tfplan

      - name: Capture outputs
        id: outputs
        if: inputs.action == 'deploy'
        run: |
          {
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build and Push: Docker image to ECR
  # ===========================================================================
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: terraform
    if: inputs.action == 'deploy'

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GHA-ECR-${{ github.run_id }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin "${{ needs.terraform.outputs.ecr_repository_url }}"

      - name: Build and push
        env:
          TAG: ${{ inputs.image_tag }}
          REPO: ${{ needs.terraform.outputs.ecr_repository_url }}
        run: |
          docker build -t "ml-platform-api:${TAG}" .
          docker tag "ml-platform-api:${TAG}" "${REPO}:${TAG}"
          docker tag "ml-platform-api:${TAG}" "${REPO}:latest"
          docker push "${REPO}:${TAG}"
          docker push "${REPO}:latest"

  # ===========================================================================
  # Destroy: Terraform destroy operations
  # ===========================================================================
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: inputs.action == 'destroy' || inputs.action == 'destroy-eks-only'

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/${{ inputs.environment }}

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GHA-Destroy-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: terraform init

      - name: Run destroy script
        run: |
          if [ "${{ inputs.action }}" == "destroy" ]; then
            chmod +x destroy-eks.sh
            echo "yes" | ./destroy-eks.sh
          else
            chmod +x destroy-eks-only.sh
            echo "yes" | ./destroy-eks-only.sh
          fi
