name: Terraform Apply

# =============================================================================
# TERRAFORM APPLY WORKFLOW (Main Branch Automation)
# =============================================================================
#
# PURPOSE:
#   Automatically deploys infrastructure changes when merged to main
#   GitOps pattern - main branch is source of truth
#
# WHEN IT RUNS:
#   - On push to main branch
#   - Only when Terraform files change
#
# WHAT IT DOES:
#   - Deploys/updates EKS infrastructure
#   - Builds and pushes Docker image to ECR
#   - Updates deployment summary
#
# SAFEGUARDS:
#   - Requires PR review (plan ran in terraform-plan.yml)
#   - Environment protection rules (GitHub settings)
#   - Auto-approve enabled (already reviewed in PR)
#
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - "infra/aws-core/terraform/**"

# Prevent concurrent applies
concurrency:
  group: terraform-apply-production
  cancel-in-progress: false # Don't cancel in-flight applies

permissions:
  id-token: write # Required for AWS OIDC
  contents: read # Required to checkout
  issues: write # To comment on related issues

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: production # "production" is the GitHub environment protection name (not the infra env)

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/dev

    outputs:
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      ecr_repository_url: ${{ steps.outputs.outputs.ecr_repository_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-TF-Apply-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Refresh State
        run: terraform apply -refresh-only -auto-approve -no-color
        continue-on-error: false

      - name: Terraform Apply
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve
          echo "✅ Terraform apply completed"

      - name: Capture outputs
        id: outputs
        run: |
          if ! terraform output cluster_name >/dev/null 2>&1; then
            echo "ERROR: cluster_name output not found in Terraform configuration"
            exit 1
          fi
          if ! terraform output ecr_repository_url >/dev/null 2>&1; then
            echo "ERROR: ecr_repository_url output not found in Terraform configuration"
            exit 1
          fi
          {
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Display summary
        run: |
          {
            echo "## 🎉 EKS Deployment Successful"
            echo ""
            echo "### Cluster Information"
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| **Cluster** | $(terraform output -raw cluster_name) |"
            echo "| **ECR** | $(terraform output -raw ecr_repository_url) |"
            echo ""
            echo "### Configure kubectl"
            echo '```bash'
            terraform output -raw kubeconfig_command
            echo '```'
            echo ""
            echo "### 💰 Cost: ~\$6.27/day"
            echo "Run \`gh workflow run terraform-manual.yml -f action=destroy\` when done"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-ECR-${{ github.run_id }}

      - name: Login to ECR
        run: |
          set -e
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin ${{ needs.deploy.outputs.ecr_repository_url }}
          echo "✓ ECR login successful"

      - name: Build and push
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPO: ${{ needs.deploy.outputs.ecr_repository_url }}
        run: |
          docker build -t "ml-platform-api:${IMAGE_TAG}" .
          docker tag "ml-platform-api:${IMAGE_TAG}" "${ECR_REPO}:${IMAGE_TAG}"
          docker tag "ml-platform-api:${IMAGE_TAG}" "${ECR_REPO}:latest"
          docker push "${ECR_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REPO}:latest"

      - name: Display summary
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          {
            echo "## 📦 Image Pushed to ECR"
            echo ""
            echo "**Tag**: \`${IMAGE_TAG}\`"
            echo "**Repository**: \`${{ needs.deploy.outputs.ecr_repository_url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
