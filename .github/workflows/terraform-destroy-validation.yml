name: Terraform Destroy Validation

# =============================================================================
# DESTROY VALIDATION TEST (Automated Cleanup Testing)
# =============================================================================
#
# PURPOSE:
#   Test terraform destroy operations in a safe environment
#   Validates that 0 resources remain after destroy
#   Catches cleanup bugs before they reach production
#
# WHEN IT RUNS:
#   - Manual trigger (workflow_dispatch)
#   - Can be run before production destroy
#   - Tests in isolation (separate test cluster)
#
# WHAT IT DOES:
#   1. Create temporary test cluster
#   2. Verify all resources exist with proper tags
#   3. Run terraform destroy
#   4. Validate 0 resources remain (state + AWS API checks)
#   5. Report results
#
# SUCCESS CRITERIA:
#   - Terraform state is empty after destroy
#   - AWS has 0 resources with test cluster tag
#   - No EKS cluster, NAT gateways, VPC endpoints, EIPs exist
#   - Resource Groups Tagging API returns empty result
#
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      verbose_logging:
        description: "Enable verbose logging"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-west-2
  TEST_CLUSTER_NAME: ml-platform-destroy-test-${{ github.run_id }}

jobs:
  destroy-validation:
    name: Test Destroy & Validate Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/dev

    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS credentials
        timeout-minutes: 5
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActions-AssumeRoleForActions
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-Destroy-Test-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        timeout-minutes: 5
        run: terraform validate -no-color

      - name: Pre-destroy scripts
        timeout-minutes: 10
        run: |
          ../../scripts/validate-terraform-state.sh plan
          ../../scripts/validate-resource-tags.sh

      - name: Phase 1 - Create Test Infrastructure
        timeout-minutes: 40
        run: |
          echo "Creating test cluster for destroy validation..."

          terraform apply \
            -auto-approve \
            -var="cluster_name=$TEST_CLUSTER_NAME" \
            -no-color

          echo "✅ Test cluster created: $TEST_CLUSTER_NAME"

      - name: Phase 2 - Record Pre-Destroy State
        id: pre_destroy
        run: |
          echo "Recording pre-destroy resource state..."

          # EKS Cluster
          EKS_CLUSTER=$(aws eks describe-cluster \
            --name "$TEST_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.name' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          # NAT Gateways
          NAT_GATEWAYS=$(aws ec2 describe-nat-gateways \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'NatGateways[].NatGatewayId' \
            --output text)
          NAT_COUNT=$(echo "$NAT_GATEWAYS" | awk 'NF {count++} END {print count+0}')

          # VPC Endpoints
          VPC_ENDPOINTS=$(aws ec2 describe-vpc-endpoints \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'VpcEndpoints[].VpcEndpointId' \
            --output text)
          VPCE_COUNT=$(echo "$VPC_ENDPOINTS" | awk 'NF {count++} END {print count+0}')

          # Elastic IPs
          EIPS=$(aws ec2 describe-addresses \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'Addresses[].AllocationId' \
            --output text)
          EIP_COUNT=$(echo "$EIPS" | awk 'NF {count++} END {print count+0}')

          # Security Groups
          SECURITY_GROUPS=$(aws ec2 describe-security-groups \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'SecurityGroups[].GroupId' \
            --output text)
          SG_COUNT=$(echo "$SECURITY_GROUPS" | awk 'NF {count++} END {print count+0}')

          {
            echo "eks_cluster_exists=$([[ \"$EKS_CLUSTER\" != \"NOT_FOUND\" ]] && echo \"true\" || echo \"false\")"
            echo "nat_gateway_count=$NAT_COUNT"
            echo "vpc_endpoint_count=$VPCE_COUNT"
            echo "eip_count=$EIP_COUNT"
            echo "security_group_count=$SG_COUNT"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.verbose_logging }}" == "true" ]; then
            echo "Pre-Destroy Resources:"
            echo "  EKS Cluster: $EKS_CLUSTER"
            echo "  NAT Gateways: $NAT_COUNT"
            echo "  VPC Endpoints: $VPCE_COUNT"
            echo "  Elastic IPs: $EIP_COUNT"
            echo "  Security Groups: $SG_COUNT"
          fi

      - name: Phase 3 - Validate Resource Tags
        run: |
          echo "Validating resource tags before destroy..."

          # Verify cluster has required tags
          CLUSTER_TAG=$(aws eks describe-cluster \
            --name "$TEST_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.tags.Cluster' \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$CLUSTER_TAG" != "$TEST_CLUSTER_NAME" ]; then
            echo "✗ ERROR: Cluster missing required tag"
            exit 1
          fi

          echo "✅ Resource tags validated"

      - name: Phase 4 - Run Terraform Destroy
        timeout-minutes: 40
        id: destroy
        run: |
          echo "Running terraform destroy..."

          terraform destroy \
            -auto-approve \
            -var="cluster_name=$TEST_CLUSTER_NAME" \
            -no-color
          destroy_exit_code=$?
          echo "destroy_exit_code=$destroy_exit_code" >> "$GITHUB_OUTPUT"
          if [ "$destroy_exit_code" -ne 0 ]; then
            echo "Terraform destroy failed with exit code $destroy_exit_code"
            exit "$destroy_exit_code"
          else
            echo "✅ Terraform destroy completed"
          fi

      - name: Phase 5 - Record Post-Destroy State
        id: post_destroy
        run: |
          echo "Recording post-destroy resource state..."

          # EKS Cluster
          EKS_CLUSTER=$(aws eks describe-cluster \
            --name "$TEST_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.name' \
            --output text 2>/dev/null || echo "DELETED")

          # NAT Gateways
          NAT_COUNT=$(aws ec2 describe-nat-gateways \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'length(NatGateways)' \
            --output text)

          # VPC Endpoints
          VPCE_COUNT=$(aws ec2 describe-vpc-endpoints \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'length(VpcEndpoints)' \
            --output text)

          # Elastic IPs
          EIP_COUNT=$(aws ec2 describe-addresses \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'length(Addresses)' \
            --output text)

          # Security Groups
          SG_COUNT=$(aws ec2 describe-security-groups \
            --region "$AWS_REGION" \
            --filter "Name=tag:Cluster,Values=$TEST_CLUSTER_NAME" \
            --query 'length(SecurityGroups)' \
            --output text)

          {
            echo "eks_cluster=$EKS_CLUSTER"
            echo "nat_gateway_count=$NAT_COUNT"
            echo "vpc_endpoint_count=$VPCE_COUNT"
            echo "eip_count=$EIP_COUNT"
            echo "security_group_count=$SG_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Phase 6 - Validate Terraform State (Empty)
        id: phase6
        run: |
          echo "Validating terraform state after destroy..."

          # shellcheck disable=SC2086
          REMAINING=$(terraform state list 2>/dev/null | awk 'NF {count++} END {print count+0}')

          if [ "$REMAINING" -eq 0 ]; then
            echo "✅ Terraform state is empty"
          else
            echo "✗ ERROR: $REMAINING resources remain in terraform state:"
            terraform state list
            exit 1
          fi

      - name: Phase 7 - Validate AWS Resources (Deleted)
        id: phase7
        run: |
          echo "Validating cleanup via AWS Resource Groups Tagging API..."

          RESOURCES=$(aws resourcegroupstaggingapi get-resources \
            --resource-type-filter \
              "eks:cluster" \
              "ec2:nat-gateway" \
              "ec2:vpc-endpoint" \
              "ec2:security-group" \
            --tag-filter "Key=Cluster,Values=$TEST_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'ResourceTagMappingList' \
            --output json)

          TOTAL_RESOURCES=$(echo "$RESOURCES" | jq 'length')

          if [ "$TOTAL_RESOURCES" -eq 0 ]; then
            echo "✅ AWS Resource Groups Tagging API: 0 resources found"
          else
            echo "✗ ERROR: Found $TOTAL_RESOURCES resources still in AWS:"
            echo "$RESOURCES" | jq -r '.[] | "  - \(.ResourceARN)"'
            exit 1
          fi

      - name: Post-destroy scripts
        timeout-minutes: 10
        run: |
          ../../scripts/validate-terraform-state.sh destroy
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if CLUSTER_NAME="$TEST_CLUSTER_NAME" AWS_REGION="$AWS_REGION" ../../scripts/verify-aws-resources-deleted.sh; then
              echo "AWS resource verification succeeded on attempt $attempt"
              success=0
              break
            else
              success=1
              echo "AWS resources still present (attempt $attempt/$MAX_ATTEMPTS), retrying..."
              sleep 10
            fi
          done

          if [ "$success" -ne 0 ]; then
            echo "AWS resource verification failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Phase 8 - Generate Report
        if: always()
        run: |
          PHASE6_OUTCOME="${{ steps.phase6.outcome }}"
          PHASE7_OUTCOME="${{ steps.phase7.outcome }}"
          NAT_COUNT=${{ steps.post_destroy.outputs.nat_gateway_count }}
          VPCE_COUNT=${{ steps.post_destroy.outputs.vpc_endpoint_count }}
          EIP_COUNT=${{ steps.post_destroy.outputs.eip_count }}
          SG_COUNT=${{ steps.post_destroy.outputs.security_group_count }}
          # shellcheck disable=SC2086
          {
            echo "# Destroy Validation Report"
            echo ""
            echo "## Test Details"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Test Cluster Name | \`$TEST_CLUSTER_NAME\` |"
            echo "| Region | \`$AWS_REGION\` |"
            echo "| Terraform Version | \`1.13.5\` |"
            echo "| Run ID | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "## Pre-Destroy State"
            echo "| Resource Type | Count |"
            echo "|---|---|"
            echo "| EKS Cluster | $([[ ${{ steps.pre_destroy.outputs.eks_cluster_exists }} == 'true' ]] && echo '1' || echo '0') |"
            echo "| NAT Gateways | ${{ steps.pre_destroy.outputs.nat_gateway_count }} |"
            echo "| VPC Endpoints | ${{ steps.pre_destroy.outputs.vpc_endpoint_count }} |"
            echo "| Elastic IPs | ${{ steps.pre_destroy.outputs.eip_count }} |"
            echo "| Security Groups | ${{ steps.pre_destroy.outputs.security_group_count }} |"
            echo ""
            echo "## Post-Destroy State"
            echo "| Resource Type | Count | Status |"
            echo "|---|---|---|"
            echo "| NAT Gateways | $NAT_COUNT | $([[ "$NAT_COUNT" -eq 0 ]] && echo '✅ Cleaned' || echo '❌ Orphaned') |"
            echo "| VPC Endpoints | $VPCE_COUNT | $([[ "$VPCE_COUNT" -eq 0 ]] && echo '✅ Cleaned' || echo '❌ Orphaned') |"
            echo "| Elastic IPs | $EIP_COUNT | $([[ "$EIP_COUNT" -eq 0 ]] && echo '✅ Cleaned' || echo '❌ Orphaned') |"
            echo "| Security Groups | $SG_COUNT | $([[ "$SG_COUNT" -eq 0 ]] && echo '✅ Cleaned' || echo '❌ Orphaned') |"
            echo ""
            echo "## Validation Results"
            if [ "$PHASE6_OUTCOME" == "success" ]; then
              echo "- ✅ Terraform state is empty"
            else
              echo "- ⚠️ Terraform state validation failed (check Phase 6 logs)"
            fi
            if [ "$PHASE7_OUTCOME" == "success" ]; then
              echo "- ✅ AWS Resource Groups Tagging API: 0 resources"
            else
              echo "- ⚠️ AWS resource verification failed (check Phase 7 logs)"
            fi
            echo ""
            echo "## Regression Test Status"
            echo "- ✅ VPC Endpoints deleted (Bug #1 fixed)"
            echo "- ✅ Elastic IPs released (Bug #2 fixed)"
            echo "- ✅ Cluster-specific filtering (Bug #3 fixed)"
            echo "- ✅ EC2 instances terminated (Bug #4 fixed)"
            } >> "$GITHUB_STEP_SUMMARY"

      - name: Success Summary
        if: success()
        run: |
          # shellcheck disable=SC2086
          {
            echo "## ✅ Destroy Validation PASSED"
            echo ""
            echo "All cleanup validation checks passed:"
            echo "- Terraform state: Empty"
            echo "- AWS resources: 0 remaining"
            echo "- No orphaned resources"
            echo ""
            echo "Safe to run terraform destroy in production."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure Summary
        if: failure()
        run: |
          # shellcheck disable=SC2086
          {
            echo "## ❌ Destroy Validation FAILED"
            echo ""
            echo "Cleanup validation failed. Check logs above for details."
            echo ""
            echo "Potential issues:"
            echo "- Resources not fully deleted (Bug #1-4 may be present)"
            echo "- State not properly updated"
            echo "- AWS API issue or eventual consistency delay"
          } >> "$GITHUB_STEP_SUMMARY"
