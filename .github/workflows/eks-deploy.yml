name: EKS Infrastructure Deployment

# =============================================================================
# EKS INFRASTRUCTURE DEPLOYMENT WORKFLOW
# =============================================================================
#
# PURPOSE & OVERVIEW
# ------------------
# This workflow automates the complete lifecycle of AWS EKS infrastructure
# for the ML Platform Engineering Practicum learning project. It handles:
#   - Terraform backend setup (S3 + DynamoDB)
#   - EKS cluster provisioning with production-grade configurations
#   - Container registry (ECR) setup and image deployment
#   - Optional Kubernetes application deployment
#   - Infrastructure teardown with multiple strategies
#
# When to use this workflow vs manual deployment:
#   ✅ Use workflow: Auditable, reproducible, production-like automation
#   ✅ Use manual: Learning, troubleshooting, quick local iteration
#
# Learning objectives:
#   - Infrastructure as Code (Terraform) in CI/CD
#   - AWS OIDC authentication (no long-lived credentials)
#   - Multi-stage deployment workflows
#   - Cost-aware infrastructure management
#
# =============================================================================
# QUICK START
# =============================================================================
#
# First-time setup (run once):
#   gh workflow run eks-deploy.yml -f action=bootstrap
#
# Deploy infrastructure:
#   gh workflow run eks-deploy.yml -f action=deploy -f image_tag=v1.0.0
#
# Monitor deployment:
#   gh run watch
#
# Clean up when done:
#   gh workflow run eks-deploy.yml -f action=destroy
#
# Expected duration:
#   - bootstrap:         1-2 minutes
#   - plan-only:         2-3 minutes
#   - deploy:            20-25 minutes (EKS cluster creation is slow)
#   - deploy + k8s:      22-28 minutes
#   - destroy:           10-15 minutes
#   - destroy-eks-only:  8-10 minutes
#
# =============================================================================
# ACTIONS REFERENCE
# =============================================================================
#
# 1. BOOTSTRAP (One-time setup)
#    Creates Terraform remote state backend infrastructure
#
#    What it creates:
#      - S3 bucket: ml-platform-terraform-state-984479408136 (versioned, encrypted)
#      - DynamoDB table: ml-platform-terraform-locks (state locking)
#
#    When to use:
#      - Before first deployment
#      - After destroying and recreating AWS account resources
#
#    Idempotent: Safe to run multiple times (checks if resources exist)
#
# 2. PLAN-ONLY (Dry run)
#    Runs terraform plan without applying changes
#
#    What it does:
#      - Initializes Terraform with S3 backend
#      - Generates execution plan
#      - Uploads plan as workflow artifact
#
#    When to use:
#      - Before deploying to review changes
#      - To understand what infrastructure will be created
#      - For cost estimation (manual review of plan)
#
# 3. DEPLOY (Full deployment)
#    Creates/updates complete EKS infrastructure
#
#    What it creates:
#      - VPC with public/private subnets across 3 AZs
#      - NAT Gateway (single, for cost optimization)
#      - EKS cluster (Kubernetes 1.34)
#      - EKS node group (t3.medium, spot instances, 2-4 nodes)
#      - ECR repository (ml-platform-api)
#      - Security services (CloudTrail, Budgets, optionally Security Hub)
#      - Builds Docker image and pushes to ECR
#
#    What it does NOT create (intentionally):
#      - ALB controller (commented out due to Helm provider cycle)
#        → Install manually or via ArgoCD after cluster is up
#
#    When to use:
#      - Initial infrastructure setup
#      - Applying infrastructure changes
#      - Updating EKS cluster or node configuration
#
#    Optional: Set deploy_to_k8s=true to also deploy K8s manifests
#
# 4. DESTROY (Full teardown)
#    Destroys EKS infrastructure, keeps security services
#
#    What it destroys:
#      - EKS cluster and node groups
#      - VPC, subnets, NAT gateway
#      - ECR lifecycle policies (but keeps ECR repository)
#
#    What it preserves:
#      - S3 Terraform state bucket
#      - DynamoDB state lock table
#      - ECR repository (for faster redeployment)
#      - CloudTrail, Budgets
#
#    When to use:
#      - Done with EKS cluster for extended period
#      - Maximum cost savings (~$6.27/day → ~$0.60/month)
#
#    Cost after destroy: ~$0.60/month (S3 state + ECR storage)
#
# 5. DESTROY-EKS-ONLY (Partial teardown)
#    Destroys EKS cluster but keeps VPC for faster recreation
#
#    What it destroys:
#      - EKS cluster and node groups
#
#    What it preserves:
#      - VPC, subnets, NAT gateway
#      - Everything from "destroy" action
#
#    When to use:
#      - Daily testing workflow (tear down overnight, recreate next day)
#      - Faster recreation (8-10 min vs 15-20 min)
#
#    Cost after destroy: ~$1.60/day (NAT gateway) + ~$0.60/month
#    Recreation time: 8-10 minutes (vs 15-20 for full deploy)
#
# =============================================================================
# PREREQUISITES
# =============================================================================
#
# ✅ CONFIGURED:
#   - AWS OIDC provider (token.actions.githubusercontent.com)
#   - IAM role: GitHubActions-AssumeRoleForActions
#   - Trust policy allows: repo:wlevan3/*
#   - See: docs/AWS_OIDC_SETUP.md
#
# ⚠️ REQUIRED BEFORE FIRST RUN:
#   - Run bootstrap action to create S3 backend
#
# 🔒 SECURITY:
#   - No AWS credentials in GitHub secrets (uses OIDC)
#   - Terraform state encrypted at rest (S3 server-side encryption)
#   - State locking prevents concurrent modifications (DynamoDB)
#
# =============================================================================
# ARCHITECTURE CONTEXT
# =============================================================================
#
# Terraform Module Structure:
#   terraform/environments/dev/
#   ├── main.tf              # Orchestrates all modules
#   ├── modules/
#   │   ├── networking/      # VPC, subnets, NAT gateway
#   │   ├── eks-cluster/     # EKS control plane + node groups
#   │   ├── container-registry/  # ECR repository
#   │   └── security/        # CloudTrail, Budgets, Security Hub
#
# Key Architectural Decisions:
#
# 1. Spot Instances (70% cost savings)
#    - Node group uses EC2 Spot instances by default
#    - Trade-off: Potential interruptions vs cost savings
#    - Suitable for dev/learning environments
#
# 2. Single NAT Gateway ($1.10/day savings)
#    - Dev environment uses 1 NAT gateway vs 3 (one per AZ)
#    - Trade-off: Single point of failure vs cost
#    - Production should use one NAT per AZ
#
# 3. ALB Controller Commented Out
#    - Helm provider creates circular dependency with EKS
#    - Install options after cluster creation:
#      a) Manual: kubectl apply -f alb-controller.yaml
#      b) ArgoCD Application (issue #100)
#      c) Separate Terraform workspace
#    - See: terraform/environments/dev/main.tf:92-116
#
# 4. Security Services Optional
#    - Security Hub, GuardDuty, Inspector disabled by default (cost)
#    - Enable via terraform variables for production
#
# =============================================================================
# COST BREAKDOWN
# =============================================================================
#
# RUNNING COSTS (per day):
#   EKS control plane:    $1.76/day  ($0.10/hour × 24)
#   NAT gateway:          $1.10/day  ($0.045/hour × 24)
#   2× t3.medium spots:   ~$1.50/day (70% cheaper than on-demand)
#   Data transfer:        ~$0.50/day (varies)
#   ECR storage:          ~$0.02/day (minimal)
#   ──────────────────────────────────
#   TOTAL:                ~$6.27/day ($188/month if left running)
#
# IDLE COSTS (after destroy):
#   S3 state storage:     ~$0.10/month
#   DynamoDB:             FREE (pay-per-request, minimal ops)
#   ECR repository:       ~$0.50/month (depends on images stored)
#   ──────────────────────────────────
#   TOTAL:                ~$0.60/month
#
# IDLE COSTS (after destroy-eks-only):
#   NAT gateway:          $1.10/day ($33/month)
#   S3 + DynamoDB + ECR:  ~$0.60/month
#   ──────────────────────────────────
#   TOTAL:                ~$34/month (trade-off for faster recreation)
#
# Cost Optimization Tips:
#   - Use destroy action when done for the day
#   - Use destroy-eks-only for rapid iteration cycles
#   - Spot instances save ~$3/day vs on-demand
#   - Single NAT gateway saves ~$2.20/day vs 3 NATs
#
# =============================================================================
# COMMON WORKFLOWS
# =============================================================================
#
# FIRST-TIME SETUP:
#   1. gh workflow run eks-deploy.yml -f action=bootstrap
#   2. gh workflow run eks-deploy.yml -f action=deploy -f image_tag=v1.0.0
#   3. aws eks update-kubeconfig --name ml-platform-dev --region us-west-2
#   4. kubectl get nodes
#
# DEVELOPMENT ITERATION:
#   # Make code changes
#   1. gh workflow run eks-deploy.yml -f action=deploy -f image_tag=v1.0.1
#   2. kubectl rollout status deployment/ml-platform-api -n ml-platform
#
# NIGHTLY CLEANUP (save costs):
#   gh workflow run eks-deploy.yml -f action=destroy-eks-only
#
# NEXT MORNING RESTART:
#   gh workflow run eks-deploy.yml -f action=deploy -f image_tag=v1.0.0
#   # Faster: 8-10 min (VPC already exists)
#
# COMPLETE TEARDOWN:
#   gh workflow run eks-deploy.yml -f action=destroy
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# ERROR: "Resource not found: S3 bucket"
#   CAUSE:  Backend not bootstrapped
#   FIX:    gh workflow run eks-deploy.yml -f action=bootstrap
#
# ERROR: "OIDC authentication failed"
#   CAUSE:  IAM role trust policy doesn't allow this repo
#   FIX:    Check trust policy allows repo:wlevan3/*
#           aws iam get-role --role-name GitHubActions-AssumeRoleForActions
#
# ERROR: "Terraform state lock"
#   CAUSE:  Another workflow run in progress
#   FIX:    Wait for completion or cancel: gh run cancel <run-id>
#
# ERROR: "EKS cluster creation timeout"
#   CAUSE:  AWS control plane provisioning takes 10-15 minutes
#   FIX:    Normal behavior, wait for completion
#
# ERROR: "Insufficient capacity" (Spot instances)
#   CAUSE:  Spot capacity not available in selected AZ
#   FIX:    Retry workflow (AWS will try different AZs)
#           OR use on-demand: set use_spot_instances=false in variables
#
# View detailed logs:
#   gh run view <run-id> --log
#
# Download plan artifact:
#   gh run download <run-id>
#
# =============================================================================
# RELATED DOCUMENTATION
# =============================================================================
#
# Workflow Documentation:
#   - .github/workflows/README.md        (All workflows reference)
#   - docs/QUICK_REFERENCE.md            (Quick command reference)
#
# Deployment Guides:
#   - docs/terraform/operations/DEPLOYMENT_GUIDE.md  (Detailed deployment)
#   - docs/terraform/operations/COST_SAVING_WORKFLOW.md  (Cost strategies)
#
# Infrastructure Documentation:
#   - terraform/environments/dev/README.md  (Module documentation)
#   - terraform/modules/*/README.md         (Individual modules)
#
# Security:
#   - docs/AWS_OIDC_SETUP.md             (OIDC authentication)
#   - docs/SECURITY.md                   (Security practices)
#
# Related Issues:
#   - #106: Configure kubectl for EKS (prerequisite)
#   - #107: Install AWS Load Balancer Controller
#   - #108: Create ArgoCD directory structure
#   - #100: Set up ArgoCD for GitOps
#
# =============================================================================
# SECURITY CONSIDERATIONS
# =============================================================================
#
# Authentication:
#   - Uses GitHub OIDC for AWS authentication (no long-lived credentials)
#   - Role session is scoped to this workflow run (role-session-name)
#   - Credentials auto-expire after workflow completes
#
# State File Security:
#   - Terraform state stored in S3 with server-side encryption (AES-256)
#   - State bucket has versioning enabled (30 versions retained)
#   - Public access blocked on state bucket
#   - State locking prevents concurrent modifications
#
# Secrets Management:
#   - No AWS credentials stored in GitHub secrets
#   - No sensitive data in workflow outputs
#   - Terraform outputs with sensitive=true are masked
#
# Actions Security:
#   - All actions pinned to commit SHAs (supply chain security)
#   - Minimal required permissions per job
#   - Checkout action uses verified publisher
#
# Network Security:
#   - EKS API endpoint: Public (required for GitHub Actions access)
#   - Worker nodes: Private subnets only
#   - NAT gateway for egress traffic
#
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - bootstrap
          - plan-only
          - deploy
          - destroy
          - destroy-eks-only
        default: "bootstrap"

      environment:
        description: "Environment to target"
        required: true
        type: choice
        options:
          - dev
        default: "dev"

      image_tag:
        description: "Docker image tag (for deploy action)"
        required: false
        default: "v1.0.0"

      deploy_to_k8s:
        description: "Deploy to Kubernetes after ECR push (deploy action only)"
        required: false
        type: boolean
        default: false

      auto_approve:
        description: "⚠️ Auto-approve terraform apply (CAUTION: use only for testing)"
        required: false
        type: boolean
        default: false

# Required permissions for OIDC authentication
permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read # Required to checkout repository
  issues: write # Optional: to comment on related issues

jobs:
  # ===========================================================================
  # Job: bootstrap-backend
  # Creates S3 bucket and DynamoDB table for Terraform remote state
  # ===========================================================================
  bootstrap-backend:
    name: Bootstrap Terraform Backend
    runs-on: ubuntu-latest
    if: inputs.action == 'bootstrap'

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # -----------------------------------------------------------------------
      # Step 2: Configure AWS credentials
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::984479408136:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-Bootstrap-${{ github.run_id }}

      # -----------------------------------------------------------------------
      # Step 3: Create S3 bucket with comprehensive error handling
      # -----------------------------------------------------------------------
      - name: Create S3 bucket for Terraform state
        run: |
          BUCKET="ml-platform-terraform-state-984479408136"
          REGION="us-west-2"

          echo "🪣 Creating S3 bucket: ${BUCKET}"

          # Check if bucket exists and in correct region
          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "ℹ️  Bucket exists, verifying configuration..."

            # Check bucket region
            BUCKET_REGION=$(aws s3api get-bucket-location \
              --bucket "${BUCKET}" \
              --query 'LocationConstraint' \
              --output text 2>/dev/null || echo "us-east-1")

            # Handle us-east-1 special case (returns null/None)
            if [ "$BUCKET_REGION" == "None" ] || [ "$BUCKET_REGION" == "null" ]; then
              BUCKET_REGION="us-east-1"
            fi

            if [ "$BUCKET_REGION" != "$REGION" ]; then
              echo "❌ ERROR: Bucket exists in wrong region"
              echo "  Expected: ${REGION}"
              echo "  Actual: ${BUCKET_REGION}"
              echo ""
              echo "::error title=Bucket Region Mismatch::S3 bucket '${BUCKET}' exists in ${BUCKET_REGION} but workflow expects ${REGION}"
              echo ""
              echo "Options to fix:"
              echo "  1. Delete bucket in ${BUCKET_REGION}: aws s3 rb s3://${BUCKET} --force"
              echo "  2. OR update workflow to use ${BUCKET_REGION}"
              echo "  3. OR use a different bucket name"
              exit 1
            fi

            echo "✅ Bucket exists in correct region: ${REGION}"
          else
            # Create bucket
            echo "Creating new S3 bucket..."

            if ! aws s3api create-bucket \
              --bucket "${BUCKET}" \
              --region "${REGION}" \
              --create-bucket-configuration LocationConstraint="${REGION}" 2>&1; then

              echo "❌ ERROR: Failed to create S3 bucket"
              echo ""
              echo "::error title=Bucket Creation Failed::Could not create S3 bucket. Check permissions and bucket name availability."
              echo ""
              echo "Common causes:"
              echo "  - Bucket name already taken globally (S3 names are globally unique)"
              echo "  - Insufficient IAM permissions (need s3:CreateBucket)"
              echo "  - Region restrictions or service control policies"
              exit 1
            fi

            echo "✅ S3 bucket created: ${BUCKET}"
          fi

          # Configure bucket settings with error handling
          echo "Configuring bucket settings..."

          # Enable versioning
          if ! aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Enabled 2>&1; then
            echo "⚠️  Warning: Could not enable versioning (continuing...)"
          else
            echo "✅ Versioning enabled"
          fi

          # Enable encryption
          if ! aws s3api put-bucket-encryption \
            --bucket "${BUCKET}" \
            --server-side-encryption-configuration '{
                "Rules": [{
                    "ApplyServerSideEncryptionByDefault": {
                        "SSEAlgorithm": "AES256"
                    },
                    "BucketKeyEnabled": true
                }]
            }' 2>&1; then
            echo "⚠️  Warning: Could not enable encryption (continuing...)"
          else
            echo "✅ Encryption enabled"
          fi

          # Block public access
          if ! aws s3api put-public-access-block \
            --bucket "${BUCKET}" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true" 2>&1; then
            echo "⚠️  Warning: Could not block public access (continuing...)"
          else
            echo "✅ Public access blocked"
          fi

          echo ""
          echo "✅ S3 bucket configured successfully"

      # -----------------------------------------------------------------------
      # Step 4: Create DynamoDB table
      # -----------------------------------------------------------------------
      - name: Create DynamoDB table for state locking
        run: |
          TABLE="ml-platform-terraform-locks"
          REGION="us-west-2"

          echo "🗄️  Creating DynamoDB table: ${TABLE}"

          # Check if table exists
          if aws dynamodb describe-table \
            --table-name "${TABLE}" \
            --region "${REGION}" >/dev/null 2>&1; then
            echo "✅ DynamoDB table already exists: ${TABLE}"
          else
            aws dynamodb create-table \
              --table-name "${TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}" \
              --tags Key=Project,Value=ml-platform-engineering-practicum \
                     Key=ManagedBy,Value=github-actions \
              >/dev/null

            echo "✅ DynamoDB table created: ${TABLE}"
          fi

      # -----------------------------------------------------------------------
      # Step 5: Verify resources
      # -----------------------------------------------------------------------
      - name: Verify backend resources
        run: |
          echo "🔍 Verifying resources..."

          # Verify S3 bucket
          VERSIONING=$(aws s3api get-bucket-versioning \
            --bucket ml-platform-terraform-state-984479408136 \
            --query Status --output text)
          echo "✅ S3 bucket verified (versioning: ${VERSIONING})"

          # Verify DynamoDB table
          TABLE_STATUS=$(aws dynamodb describe-table \
            --table-name ml-platform-terraform-locks \
            --region us-west-2 \
            --query Table.TableStatus --output text)
          echo "✅ DynamoDB table verified (status: ${TABLE_STATUS})"

      # -----------------------------------------------------------------------
      # Step 6: Output summary
      # -----------------------------------------------------------------------
      - name: Output summary
        run: |
          {
            echo "## ✅ Bootstrap Complete"
            echo ""
            echo "### Resources Created"
            echo ""
            echo "- **S3 Bucket**: \`ml-platform-terraform-state-984479408136\`"
            echo "  - Versioning: Enabled"
            echo "  - Encryption: AES-256"
            echo "  - Public access: Blocked"
            echo ""
            echo "- **DynamoDB Table**: \`ml-platform-terraform-locks\`"
            echo "  - Billing: Pay-per-request"
            echo "  - Purpose: Terraform state locking"
            echo ""
            echo "### Next Steps"
            echo ""
            echo "Deploy EKS infrastructure:"
            echo '```bash'
            echo "gh workflow run eks-deploy.yml -f action=deploy -f image_tag=v1.0.0"
            echo '```'
            echo ""
            echo "### Cost"
            echo ""
            echo "- S3 storage: ~\$0.10-0.50/month"
            echo "- DynamoDB: FREE (pay-per-request)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job: terraform-deploy
  # Deploys EKS infrastructure using Terraform with OIDC authentication
  # ===========================================================================
  terraform-deploy:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    # Only run for deploy and plan-only actions
    if: inputs.action == 'deploy' || inputs.action == 'plan-only'

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/${{ inputs.environment }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # -----------------------------------------------------------------------
      # Step 2: Configure AWS credentials using OIDC (no secrets required)
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::984479408136:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-EKS-Deploy-${{ github.run_id }}

      # -----------------------------------------------------------------------
      # Step 3: Verify AWS authentication
      # -----------------------------------------------------------------------
      - name: Verify AWS credentials
        run: |
          echo "✅ AWS authentication successful"
          aws sts get-caller-identity

      # -----------------------------------------------------------------------
      # Step 4: Validate Terraform backend exists
      # -----------------------------------------------------------------------
      - name: Validate Terraform backend
        id: validate-backend
        run: |
          echo "🔍 Validating Terraform backend resources..."

          BUCKET="ml-platform-terraform-state-984479408136"
          TABLE="ml-platform-terraform-locks"
          REGION="us-west-2"

          # Check S3 bucket exists and is accessible
          if ! aws s3api head-bucket --bucket "${BUCKET}" --region "${REGION}" 2>/dev/null; then
            echo "❌ ERROR: S3 bucket '${BUCKET}' not found or not accessible"
            echo ""
            echo "::error title=Backend Not Bootstrapped::Terraform backend not initialized. Run bootstrap action first."
            echo ""
            echo "To fix this, run:"
            echo "  gh workflow run eks-deploy.yml -f action=bootstrap"
            exit 1
          fi

          # Check DynamoDB table exists
          if ! aws dynamodb describe-table --table-name "${TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "❌ ERROR: DynamoDB table '${TABLE}' not found"
            echo ""
            echo "::error title=Backend Not Bootstrapped::Terraform state locking table not found. Run bootstrap action first."
            echo ""
            echo "To fix this, run:"
            echo "  gh workflow run eks-deploy.yml -f action=bootstrap"
            exit 1
          fi

          echo "✅ Backend validated successfully"
          echo "  - S3 bucket: ${BUCKET}"
          echo "  - DynamoDB table: ${TABLE}"

      # -----------------------------------------------------------------------
      # Step 5: Setup Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      # -----------------------------------------------------------------------
      # Step 6: Terraform Init (initialize backend and providers)
      # -----------------------------------------------------------------------
      - name: Terraform Init
        id: init
        run: |
          echo "🔧 Initializing Terraform with S3 backend..."
          terraform init

      # -----------------------------------------------------------------------
      # Step 7: Terraform Validate
      # -----------------------------------------------------------------------
      - name: Terraform Validate
        id: validate
        run: |
          echo "✅ Validating Terraform configuration..."
          terraform validate -no-color

      # -----------------------------------------------------------------------
      # Step 8: Terraform Plan (always run)
      # -----------------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        run: |
          echo "📋 Running Terraform plan..."
          terraform plan -out=tfplan -no-color | tee plan.txt

          # Extract resource summary
          {
            echo "## Terraform Plan Summary"
            echo ""
            echo '```'
            grep -A 10 "Plan:" plan.txt || echo "No changes detected"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Step 9: Upload plan as artifact
      # -----------------------------------------------------------------------
      - name: Upload Terraform plan
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: infra/aws-core/terraform/environments/${{ inputs.environment }}/plan.txt
          retention-days: 30

      # -----------------------------------------------------------------------
      # Step 10: Terraform Apply (only for deploy action)
      # -----------------------------------------------------------------------
      - name: Terraform Apply
        id: apply
        if: inputs.action == 'deploy'
        run: |
          echo "🚀 Applying Terraform changes..."

          if [ "${{ inputs.auto_approve }}" == "true" ]; then
            echo "⚠️ Auto-approve enabled - applying without confirmation"
            terraform apply -auto-approve tfplan
          else
            terraform apply tfplan
          fi

          echo "✅ Terraform apply completed successfully"

      # -----------------------------------------------------------------------
      # Step 11: Capture Terraform outputs
      # -----------------------------------------------------------------------
      - name: Capture Terraform outputs
        id: outputs
        if: inputs.action == 'deploy'
        run: |
          echo "📤 Capturing Terraform outputs..."

          # Validate all required outputs exist
          REQUIRED_OUTPUTS=("cluster_name" "cluster_endpoint" "ecr_repository_url" "kubeconfig_command")
          MISSING_OUTPUTS=()

          for output in "${REQUIRED_OUTPUTS[@]}"; do
            if ! terraform output -raw "$output" >/dev/null 2>&1; then
              MISSING_OUTPUTS+=("$output")
            fi
          done

          if [ ${#MISSING_OUTPUTS[@]} -gt 0 ]; then
            echo "❌ ERROR: Required Terraform outputs not defined:"
            for output in "${MISSING_OUTPUTS[@]}"; do
              echo "  - $output"
            done
            echo ""
            echo "::error title=Missing Terraform Outputs::Required outputs not found: ${MISSING_OUTPUTS[*]}"
            echo ""
            echo "Check terraform/environments/${{ inputs.environment }}/main.tf outputs block"
            exit 1
          fi

          # Export validated outputs
          {
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)"
            echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
            echo "kubeconfig_command=$(terraform output -raw kubeconfig_command)"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Terraform outputs captured successfully"

      # -----------------------------------------------------------------------
      # Step 12: Display deployment summary
      # -----------------------------------------------------------------------
      - name: Display deployment summary
        if: inputs.action == 'deploy'
        run: |
          {
            echo "## 🎉 EKS Deployment Successful"
            echo ""
            echo "### Cluster Information"
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| **Cluster Name** | $(terraform output -raw cluster_name) |"
            echo "| **Region** | us-west-2 |"
            echo "| **ECR Repository** | $(terraform output -raw ecr_repository_url) |"
            echo ""
            echo "### Next Steps"
            echo ""
            echo "1. **Configure kubectl**:"
            echo '   ```bash'
            echo "   $(terraform output -raw kubeconfig_command)"
            echo '   ```'
            echo ""
            echo "2. **Verify cluster access**:"
            echo '   ```bash'
            echo "   kubectl get nodes"
            echo "   kubectl get namespaces"
            echo '   ```'
            echo ""
            echo "### 💰 Cost Reminder"
            echo ""
            echo "- **Running cost**: ~\$0.26/hour (\$6.27/day)"
            echo "- **Remember to destroy** when done testing: Re-run this workflow with \`destroy\` action"
            echo ""
            echo "### 📚 Documentation"
            echo ""
            echo "- [Deployment Guide](../docs/terraform/operations/DEPLOYMENT_GUIDE.md)"
            echo "- [Cost Saving Workflow](../docs/terraform/operations/COST_SAVING_WORKFLOW.md)"
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      ecr_repository_url: ${{ steps.outputs.outputs.ecr_repository_url }}

  # ===========================================================================
  # Job: build-and-push-ecr
  # Builds Docker image and pushes to ECR (only for deploy action)
  # ===========================================================================
  build-and-push-ecr:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: terraform-deploy
    if: inputs.action == 'deploy'

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # -----------------------------------------------------------------------
      # Step 2: Configure AWS credentials
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::984479408136:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-ECR-Push-${{ github.run_id }}

      # -----------------------------------------------------------------------
      # Step 3: Login to Amazon ECR
      # -----------------------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        run: |
          echo "🔐 Authenticating to Amazon ECR..."
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin ${{ needs.terraform-deploy.outputs.ecr_repository_url }}

      # -----------------------------------------------------------------------
      # Step 4: Build Docker image
      # -----------------------------------------------------------------------
      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t ml-platform-api:${{ inputs.image_tag }} .

          # Tag for ECR
          docker tag ml-platform-api:${{ inputs.image_tag }} \
            ${{ needs.terraform-deploy.outputs.ecr_repository_url }}:${{ inputs.image_tag }}

          docker tag ml-platform-api:${{ inputs.image_tag }} \
            ${{ needs.terraform-deploy.outputs.ecr_repository_url }}:latest

      # -----------------------------------------------------------------------
      # Step 5: Push to ECR
      # -----------------------------------------------------------------------
      - name: Push to ECR
        run: |
          echo "📤 Pushing image to ECR..."
          docker push ${{ needs.terraform-deploy.outputs.ecr_repository_url }}:${{ inputs.image_tag }}
          docker push ${{ needs.terraform-deploy.outputs.ecr_repository_url }}:latest

          echo "✅ Image pushed successfully"

      # -----------------------------------------------------------------------
      # Step 6: Verify image in ECR
      # -----------------------------------------------------------------------
      - name: Verify image in ECR
        run: |
          echo "🔍 Verifying image in ECR..."
          aws ecr describe-images \
            --repository-name ml-platform-api \
            --region us-west-2 \
            --query "imageDetails[?imageTags!=\`null\`].[imageTags[0],imagePushedAt]" \
            --output table

          {
            echo "## 📦 ECR Image Push Successful"
            echo ""
            echo "**Image Tag**: \`${{ inputs.image_tag }}\`"
            echo ""
            echo "**Repository**: \`${{ needs.terraform-deploy.outputs.ecr_repository_url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job: deploy-to-kubernetes
  # Deploys application to Kubernetes (optional, controlled by input)
  # ===========================================================================
  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [terraform-deploy, build-and-push-ecr]
    if: inputs.action == 'deploy' && inputs.deploy_to_k8s == true

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # -----------------------------------------------------------------------
      # Step 2: Configure AWS credentials
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::984479408136:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-K8s-Deploy-${{ github.run_id }}

      # -----------------------------------------------------------------------
      # Step 3: Configure kubectl
      # -----------------------------------------------------------------------
      - name: Configure kubectl
        run: |
          echo "⚙️ Configuring kubectl for EKS cluster..."
          aws eks update-kubeconfig \
            --name ${{ needs.terraform-deploy.outputs.cluster_name }} \
            --region us-west-2

          echo "✅ kubectl configured successfully"
          kubectl cluster-info

      # -----------------------------------------------------------------------
      # Step 4: Apply Kubernetes manifests
      # -----------------------------------------------------------------------
      - name: Apply Kubernetes manifests
        run: |
          echo "🚀 Applying Kubernetes manifests..."

          # Apply manifests (creates or updates resources)
          kubectl apply -f clusters/dev/bootstrap/k8s-manifests/namespace.yaml || true
          kubectl apply -f clusters/dev/bootstrap/k8s-manifests/deployment.yaml
          kubectl apply -f clusters/dev/bootstrap/k8s-manifests/service.yaml

          echo "✅ Manifests applied"

      # -----------------------------------------------------------------------
      # Step 5: Update deployment image
      # -----------------------------------------------------------------------
      - name: Update deployment image
        run: |
          echo "🔄 Updating deployment image..."

          # Use kubectl set image (more robust than sed on YAML)
          kubectl set image deployment/ml-platform-api \
            ml-platform-api=${{ needs.terraform-deploy.outputs.ecr_repository_url }}:${{ inputs.image_tag }} \
            -n ml-platform

          # Update imagePullPolicy if needed (ensure manifest uses IfNotPresent for ECR)
          kubectl patch deployment ml-platform-api -n ml-platform \
            --type='json' \
            -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy", "value": "IfNotPresent"}]'

          echo "✅ Deployment image updated"

      # -----------------------------------------------------------------------
      # Step 6: Wait for deployment rollout
      # -----------------------------------------------------------------------
      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for deployment to complete..."
          kubectl rollout status deployment/ml-platform-api -n ml-platform --timeout=5m

      # -----------------------------------------------------------------------
      # Step 7: Verify deployment
      # -----------------------------------------------------------------------
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment status..."

          kubectl get pods -n ml-platform
          kubectl get services -n ml-platform

          {
            echo "## ✅ Kubernetes Deployment Successful"
            echo ""
            echo "### Deployment Status"
            echo '```'
            kubectl get pods -n ml-platform -o wide
            echo '```'
            echo ""
            echo "### Service Endpoints"
            echo '```'
            kubectl get services -n ml-platform
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job: terraform-destroy
  # Destroys EKS infrastructure (full or EKS-only)
  # ===========================================================================
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: inputs.action == 'destroy' || inputs.action == 'destroy-eks-only'

    defaults:
      run:
        working-directory: infra/aws-core/terraform/environments/${{ inputs.environment }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # -----------------------------------------------------------------------
      # Step 2: Configure AWS credentials
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::984479408136:role/GitHubActions-AssumeRoleForActions
          aws-region: us-west-2
          role-session-name: GitHubActions-EKS-Destroy-${{ github.run_id }}

      # -----------------------------------------------------------------------
      # Step 3: Setup Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5

      # -----------------------------------------------------------------------
      # Step 4: Terraform Init
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -----------------------------------------------------------------------
      # Step 5: Run destroy script (full destroy)
      # -----------------------------------------------------------------------
      - name: Destroy EKS infrastructure (full)
        if: inputs.action == 'destroy'
        run: |
          echo "🗑️ Running full EKS destruction..."
          chmod +x destroy-eks.sh
          # Non-interactive mode
          echo "yes" | ./destroy-eks.sh

      # -----------------------------------------------------------------------
      # Step 6: Run destroy script (EKS-only)
      # -----------------------------------------------------------------------
      - name: Destroy EKS cluster only
        if: inputs.action == 'destroy-eks-only'
        run: |
          echo "🗑️ Running EKS-only destruction (keeping VPC)..."
          chmod +x destroy-eks-only.sh
          # Non-interactive mode
          echo "yes" | ./destroy-eks-only.sh

      # -----------------------------------------------------------------------
      # Step 7: Verify destruction
      # -----------------------------------------------------------------------
      - name: Verify destruction
        run: |
          echo "🔍 Verifying resource destruction..."

          # Check for EKS clusters
          CLUSTERS=$(aws eks list-clusters --region us-west-2 --query 'clusters' --output text)

          if [ -z "$CLUSTERS" ]; then
            echo "✅ No EKS clusters found - destruction successful"
          else
            echo "⚠️ Found clusters: $CLUSTERS"
          fi

          {
            echo "## 🗑️ Infrastructure Destruction Complete"
            echo ""
            if [ "${{ inputs.action }}" == "destroy" ]; then
              echo "**Destruction Type**: Full (EKS + VPC)"
              echo ""
              echo "**Remaining cost**: ~\$0.60/month (S3 state, ECR repository)"
            else
              echo "**Destruction Type**: EKS-only (VPC retained)"
              echo ""
              echo "**Remaining cost**: ~\$1.60/day (NAT Gateway) + \$0.60/month"
            fi
            echo ""
            echo "### Verification"
            echo "- EKS clusters: $CLUSTERS"
          } >> "$GITHUB_STEP_SUMMARY"
