name: Security Gate

on:
  schedule:
    # Run daily at 03:00 UTC to provide continuous security signal
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {} # Restrict default permissions; grant least-privilege per job

jobs:
  security-gate:
    name: Scheduled Security Gate (IaC, Dependencies, K8s)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Setup Python for tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Checkov - IaC scanning using existing configuration and custom policies
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          config_file: .checkov.yaml
          # Custom policies are discovered from checkov_policies/ via .checkov.yaml configuration

      # tfsec - Terraform static analysis honoring .tfsecignore
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          additional_args: >
            --soft-fail-severity=MEDIUM

      # TFLint - Terraform linting using .tflint.hcl
      - name: Run TFLint
        uses: reviewdog/action-tflint@v1
        with:
          tflint_config: .tflint.hcl
          filter_mode: "nofilter"
          reporter: "github-check"

      # Trivy - Dependency and filesystem scanning if configured
      - name: Run Trivy filesystem scan (if config present)
        if: hashFiles('.trivy.yaml') != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          trivy-config: .trivy.yaml

      # kube-linter - Kubernetes manifest scanning if manifests present
      - name: Run kube-linter against clusters manifests (if present)
        if: hashFiles('.kube-linter.yaml') != '' && hashFiles('clusters/**.yaml') != ''
        run: |
          curl -sSL https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux-amd64.tar.gz \
            | tar -xz kube-linter
          chmod +x kube-linter
          ./kube-linter lint clusters --config .kube-linter.yaml

      # Final gate: ensure overall failure on unignored HIGH/CRITICAL issues is preserved
      - name: Summarize Security Gate Result
        if: always()
        run: |
          echo "Security gate completed. Individual steps are configured to fail on unapproved HIGH/CRITICAL findings using existing policy/ignore files."
